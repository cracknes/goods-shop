<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의하기 | 노르덴돌프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>문의하기</h1>
  <p class="muted">보내주신 문의는 확인 후 답변받을 이메일로 답변드립니다.</p>

  <div class="card">
    <h2 style="font-size:16px; margin-top:0;">문의 남기기</h2>
    <input id="email" type="email" placeholder="답변받을 이메일" required>
    <input id="subject" type="text" placeholder="문의 제목" required>
    <textarea id="message" rows="8" maxlength="4000" placeholder="문의 내용 (최대 4,000자까지 입력할 수 있습니다)" required></textarea>
    <button class="primary" id="submit-btn" style="margin-top:12px;">문의 접수하기</button>
    <p id="message-status" class="muted"></p>
  </div>

  <p class="muted">반복 제출은 자동으로 제한될 수 있습니다.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script>
  document.getElementById("submit-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const subject = document.getElementById("subject").value;
    const message = document.getElementById("message").value;
    const statusEl = document.getElementById("message-status");

    if (!email || !subject || !message) {
      statusEl.textContent = "이메일, 제목, 내용은 필수입니다.";
      return;
    }

    const { error } = await supabaseClient.from("inquiries").insert({ email, subject, message });

    if (error) {
      statusEl.textContent = "문의 접수에 실패했습니다: " + error.message;
      return;
    }

    statusEl.textContent = "문의가 접수되었습니다. 답변까지 조금만 기다려주세요.";
    document.getElementById("email").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("message").value = "";
  });
</script>
</body>
</html>
