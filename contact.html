<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>문의하기 | 지후네 하우스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap" id="normal-view">
  <h1>문의하기</h1>

  <div class="tab-bar">
    <button type="button" data-tab="write" class="active">문의 접수하기</button>
    <button type="button" data-tab="mine">문의내역</button>
  </div>

  <div id="write-view">
    <p class="muted">보내주신 문의는 확인 후 답변받을 이메일로 답변드립니다.</p>

    <div class="card">
      <input id="email" type="email" placeholder="답변받을 이메일" required>
      <input id="subject" type="text" placeholder="문의 제목" required>
      <textarea id="message" rows="8" maxlength="4000" placeholder="문의 내용 (최대 4,000자까지 입력할 수 있습니다)" required></textarea>
      <button class="primary" id="submit-btn" style="margin-top:12px;">문의 접수하기</button>
      <p id="message-status" class="muted"></p>
    </div>

    <p class="muted">반복 제출은 자동으로 제한될 수 있습니다.</p>
  </div>

  <div id="mine-view" hidden>
    <p id="login-needed" class="muted" hidden>로그인 후 본인이 남긴 문의를 확인할 수 있습니다. <a href="login.html">로그인하기</a></p>

    <div class="card" id="list-card" hidden>
      <div id="inquiries-list"></div>
      <p id="empty-message" class="muted" hidden>아직 남긴 문의가 없습니다.</p>
    </div>

    <div class="card" id="detail-card" hidden>
      <button type="button" id="back-btn" class="muted" style="background:none; border:none; cursor:pointer; padding:0; margin-bottom:12px;">&larr; 목록으로</button>
      <div id="inquiry-detail"></div>
    </div>
  </div>
</div>

<div class="wrap" id="token-view" hidden>
  <h1>답변 확인</h1>
  <div class="card" id="token-inquiry-card"></div>
  <p id="token-error" class="muted" hidden></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="pwa.js"></script>
<script>
  // 문의 답변 알림(push)을 눌러서 들어온 경우(문의 ID + 1회성 토큰이 있는 경우):
  // - 아직 로그인 상태면(자동로그인 켠 기기 등) 굳이 제한된 화면을 보여줄 필요 없이, 그냥
  //   "문의내역" 탭으로 들어가서 그 문의를 바로 열어줌 — 다른 메뉴도 그대로 다 쓸 수 있음.
  // - 로그인 상태가 아니면(5분 무동작 자동로그아웃 등으로 이미 로그아웃) 계정 전체를 다시
  //   로그인시키는 대신, 그 문의 1건만 보여주는 1회성 링크로 대신함.
  // 그 외(문의/토큰 파라미터가 없는 일반 접근)에는 로그인해야만 보이는 메뉴(문의하기)라, 로그아웃
  // 후 뒤로가기로 돌아와도 로그인 상태가 아니면 메인페이지로 돌려보냄(nav.js의 bfcache
  // 새로고침과 함께 동작해서, 다른 계정/비로그인 상태로 뒤로가기 했을 때 이전 로그인 사용자의
  // 화면이 그대로 보이는 것을 막음).
  (async function initPage() {
    const params = new URLSearchParams(location.search);
    const inquiryId = params.get("inquiry");
    const token = params.get("token");
    const { data: { user } } = await supabaseClient.auth.getUser();

    if (inquiryId && token) {
      if (user) {
        document.querySelectorAll(".tab-bar button").forEach(b => b.classList.toggle("active", b.dataset.tab === "mine"));
        document.getElementById("write-view").hidden = true;
        document.getElementById("mine-view").hidden = false;
        myInquiriesLoaded = true;
        await loadMyInquiries();
        showInquiryDetail(inquiryId);
        return;
      }
      await showTokenInquiryView(inquiryId, token);
      return;
    }

    if (!user) location.href = "index.html";
  })();

  async function showTokenInquiryView(inquiryId, token) {
    document.getElementById("normal-view").hidden = true;
    document.getElementById("token-view").hidden = false;

    const { data, error } = await supabaseClient.functions.invoke("get-inquiry-by-token", {
      body: { inquiryId, token },
    });

    if (error || !data?.inquiry) {
      document.getElementById("token-error").hidden = false;
      document.getElementById("token-error").textContent = "링크가 만료되었거나 올바르지 않습니다.";
      return;
    }

    const item = data.inquiry;
    document.getElementById("token-inquiry-card").innerHTML = `
      <div class="inquiry-meta">${escapeHtml(item.subject)} · ${new Date(item.created_at).toLocaleString()}</div>
      <div class="inquiry-message">${escapeHtml(item.message)}</div>
      ${item.reply
        ? `<div class="inquiry-reply-done"><strong>답변</strong> (${new Date(item.replied_at).toLocaleString()})<br>${escapeHtml(item.reply)}</div>`
        : `<p class="muted">아직 답변이 등록되지 않았습니다.</p>`}
    `;
  }

  document.getElementById("submit-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const subject = document.getElementById("subject").value;
    const message = document.getElementById("message").value;
    const statusEl = document.getElementById("message-status");

    if (!email || !subject || !message) {
      statusEl.textContent = "이메일, 제목, 내용은 필수입니다.";
      return;
    }

    const { data: { user } } = await supabaseClient.auth.getUser();

    const { error } = await supabaseClient.from("inquiries").insert({
      email,
      subject,
      message,
      user_id: user ? user.id : null,
    });

    if (error) {
      statusEl.textContent = "문의 접수에 실패했습니다: " + error.message;
      return;
    }

    alert("접수가 완료되었습니다.");
    document.getElementById("email").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("message").value = "";
    statusEl.textContent = "";
  });

  // 탭 전환
  let myInquiriesLoaded = false;

  document.querySelectorAll(".tab-bar button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-bar button").forEach(b => b.classList.toggle("active", b === btn));
      const tab = btn.dataset.tab;
      document.getElementById("write-view").hidden = tab !== "write";
      document.getElementById("mine-view").hidden = tab !== "mine";
      if (tab === "mine" && !myInquiriesLoaded) {
        myInquiriesLoaded = true;
        loadMyInquiries();
      }
    });
  });

  let myInquiries = [];

  function showMineList() {
    document.getElementById("list-card").hidden = false;
    document.getElementById("detail-card").hidden = true;
  }

  function showInquiryDetail(id) {
    const item = myInquiries.find(i => i.id === id);
    document.getElementById("inquiry-detail").innerHTML = `
      <div class="inquiry-meta">${new Date(item.created_at).toLocaleString()}</div>
      <input id="edit-subject" type="text" value="${escapeHtml(item.subject)}">
      <textarea id="edit-message" rows="6">${escapeHtml(item.message)}</textarea>
      <button class="primary" id="edit-save-btn">수정 저장</button>
      <p id="edit-status" class="muted"></p>
      ${item.reply
        ? `<div class="inquiry-reply-done"><strong>답변</strong> (${new Date(item.replied_at).toLocaleString()})<br>${escapeHtml(item.reply)}</div>`
        : `<p class="muted">아직 답변이 등록되지 않았습니다.</p>`}
    `;

    document.getElementById("edit-save-btn").addEventListener("click", async () => {
      const subject = document.getElementById("edit-subject").value;
      const message = document.getElementById("edit-message").value;
      const statusEl = document.getElementById("edit-status");

      if (!subject || !message) {
        statusEl.textContent = "제목과 내용을 입력해 주세요.";
        return;
      }

      const { error } = await supabaseClient
        .from("inquiries")
        .update({ subject, message })
        .eq("id", id);

      if (error) {
        statusEl.textContent = "수정 실패: " + error.message;
        return;
      }

      item.subject = subject;
      item.message = message;
      statusEl.textContent = "수정되었습니다.";
      renderMyInquiriesList();
    });

    document.getElementById("list-card").hidden = true;
    document.getElementById("detail-card").hidden = false;
  }

  document.getElementById("back-btn").addEventListener("click", showMineList);

  async function loadMyInquiries() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      document.getElementById("login-needed").hidden = false;
      return;
    }

    const { data, error } = await supabaseClient
      .from("inquiries")
      .select("*")
      .order("created_at", { ascending: false });

    document.getElementById("list-card").hidden = false;

    if (error || !data.length) {
      document.getElementById("empty-message").hidden = false;
      if (error) document.getElementById("empty-message").textContent = "불러오기 실패: " + error.message;
      return;
    }

    myInquiries = data;
    renderMyInquiriesList();
  }

  function renderMyInquiriesList() {
    document.getElementById("inquiries-list").innerHTML = myInquiries.map(i => `
      <div class="inquiry-row" data-id="${i.id}">
        <div>
          <div>${escapeHtml(i.subject)}</div>
          <div class="inquiry-meta">${new Date(i.created_at).toLocaleString()}</div>
        </div>
        <span class="${i.reply ? "status-paid" : "muted"}">${i.reply ? "답변완료" : "답변대기"}</span>
      </div>
    `).join("");

    document.querySelectorAll("#inquiries-list .inquiry-row").forEach(row => {
      row.addEventListener("click", () => showInquiryDetail(row.dataset.id));
    });
  }
</script>
</body>
</html>
