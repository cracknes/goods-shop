<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 문의내역 | 노르덴돌프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>내 문의내역</h1>

  <div class="card" id="list-card">
    <div id="inquiries-list"></div>
    <p id="empty-message" class="muted" hidden>아직 남긴 문의가 없습니다. <a href="contact.html">문의하기</a></p>
  </div>

  <div class="card" id="detail-card" hidden>
    <button type="button" id="back-btn" class="muted" style="background:none; border:none; cursor:pointer; padding:0; margin-bottom:12px;">&larr; 목록으로</button>
    <div id="inquiry-detail"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script>
  let myInquiries = [];

  function showList() {
    document.getElementById("list-card").hidden = false;
    document.getElementById("detail-card").hidden = true;
  }

  function showDetail(id) {
    const item = myInquiries.find(i => i.id === id);
    document.getElementById("inquiry-detail").innerHTML = `
      <div class="inquiry-meta">${item.subject} · ${new Date(item.created_at).toLocaleString()}</div>
      <div class="inquiry-message">${item.message}</div>
      ${item.reply
        ? `<div class="inquiry-reply-done"><strong>답변</strong> (${new Date(item.replied_at).toLocaleString()})<br>${item.reply}</div>`
        : `<p class="muted">아직 답변이 등록되지 않았습니다.</p>`}
    `;
    document.getElementById("list-card").hidden = true;
    document.getElementById("detail-card").hidden = false;
  }

  document.getElementById("back-btn").addEventListener("click", showList);

  async function loadMyInquiries() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      location.href = "login.html";
      return;
    }

    const { data, error } = await supabaseClient
      .from("inquiries")
      .select("*")
      .order("created_at", { ascending: false });

    if (error || !data.length) {
      document.getElementById("empty-message").hidden = false;
      if (error) document.getElementById("empty-message").textContent = "불러오기 실패: " + error.message;
      return;
    }

    myInquiries = data;
    document.getElementById("inquiries-list").innerHTML = data.map(i => `
      <div class="inquiry-row" data-id="${i.id}">
        <div>
          <div>${i.subject}</div>
          <div class="inquiry-meta">${new Date(i.created_at).toLocaleString()}</div>
        </div>
        <span class="${i.reply ? "status-paid" : "muted"}">${i.reply ? "답변완료" : "답변대기"}</span>
      </div>
    `).join("");

    document.querySelectorAll(".inquiry-row").forEach(row => {
      row.addEventListener("click", () => showDetail(row.dataset.id));
    });
  }

  loadMyInquiries();
</script>
</body>
</html>
