<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | 지후네 하우스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap wrap-wide">
  <h1>관리자</h1>
  <p id="denied" class="error" hidden>관리자만 볼 수 있는 페이지입니다. (admin@admin.com 계정으로 로그인하세요)</p>

  <div id="admin-body" class="shop-layout" hidden>
    <div class="category-list">
      <button data-tab="orders" class="active">결제내역</button>
      <button data-tab="inquiries">문의내역</button>
      <button data-tab="logins">로그인이력</button>
      <button data-tab="productstats">상품통계</button>
    </div>
    <div class="shop-content">
      <div class="card">
        <table id="orders-table">
          <thead>
            <tr><th>사용자</th><th>상품</th><th>금액</th><th>상태</th><th>결제일시</th></tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
        <p id="orders-empty" class="muted" hidden>결제 내역이 없습니다.</p>
      </div>

      <div class="card" id="inquiries-panel" hidden>
        <div id="inquiries-list-view">
          <div id="inquiries-list"></div>
          <p id="inquiries-empty" class="muted" hidden>문의 내역이 없습니다.</p>
        </div>
        <div id="inquiries-detail-view" hidden>
          <button type="button" id="inquiries-back-btn" class="muted" style="background:none; border:none; cursor:pointer; padding:0; margin-bottom:12px;">&larr; 목록으로</button>
          <div id="inquiry-detail-content"></div>
        </div>
      </div>

      <div class="card" id="logins-panel" hidden>
        <table id="logins-table">
          <thead>
            <tr><th>사용자</th><th>로그인 시간</th></tr>
          </thead>
          <tbody id="logins-body"></tbody>
        </table>
        <p id="logins-empty" class="muted" hidden>로그인 이력이 없습니다.</p>
      </div>

      <div class="card" id="productstats-panel" hidden>
        <table id="productstats-table">
          <thead>
            <tr><th>상품</th><th>조회 수</th><th>평균 조회시간</th><th>총 조회시간</th></tr>
          </thead>
          <tbody id="productstats-body"></tbody>
        </table>
        <p id="productstats-empty" class="muted" hidden>조회 기록이 없습니다.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script>
  const ADMIN_EMAIL = "admin@admin.com";

  function switchTab(tab) {
    document.querySelectorAll(".category-list button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === tab);
    });
    document.getElementById("orders-table").closest(".card").hidden = tab !== "orders";
    document.getElementById("inquiries-panel").hidden = tab !== "inquiries";
    document.getElementById("logins-panel").hidden = tab !== "logins";
    document.getElementById("productstats-panel").hidden = tab !== "productstats";
  }

  async function loadOrders() {
    const { data: orders, error } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", { ascending: false });

    if (error || !orders.length) {
      document.getElementById("orders-empty").hidden = false;
      if (error) document.getElementById("orders-empty").textContent = "불러오기 실패: " + error.message;
      return;
    }

    document.getElementById("orders-body").innerHTML = orders.map(o => `
      <tr>
        <td data-label="사용자">${o.user_email ?? o.user_id}</td>
        <td data-label="상품">${o.product_name}</td>
        <td data-label="금액">${o.amount.toLocaleString()}원</td>
        <td data-label="상태" class="status-paid">${o.status}</td>
        <td data-label="결제일시">${new Date(o.created_at).toLocaleString()}</td>
      </tr>
    `).join("");
  }

  let allInquiries = [];

  function showInquiriesList() {
    document.getElementById("inquiries-list-view").hidden = false;
    document.getElementById("inquiries-detail-view").hidden = true;
  }

  function showInquiryDetail(id) {
    const item = allInquiries.find(i => i.id === id);
    document.getElementById("inquiry-detail-content").innerHTML = `
      <div class="inquiry-meta">${item.email} · ${item.subject} · ${new Date(item.created_at).toLocaleString()}</div>
      <div class="inquiry-message">${item.message}</div>
      ${item.reply ? `<div class="inquiry-reply-done"><strong>답변</strong> (${new Date(item.replied_at).toLocaleString()})<br>${item.reply}</div>` : ""}
      <textarea id="reply-input" rows="3" placeholder="답변 내용">${item.reply ?? ""}</textarea>
      <button class="primary" id="reply-submit">${item.reply ? "답변 수정" : "답변 등록"}</button>
      <p id="reply-status" class="muted"></p>
    `;

    document.getElementById("reply-submit").addEventListener("click", async () => {
      const reply = document.getElementById("reply-input").value;
      const statusEl = document.getElementById("reply-status");

      if (!reply) {
        statusEl.textContent = "답변 내용을 입력해 주세요.";
        return;
      }

      const replied_at = new Date().toISOString();
      const { error } = await supabaseClient
        .from("inquiries")
        .update({ reply, replied_at })
        .eq("id", id);

      if (error) {
        statusEl.textContent = "저장 실패: " + error.message;
        return;
      }

      item.reply = reply;
      item.replied_at = replied_at;
      statusEl.textContent = "답변이 저장되었습니다.";
      renderInquiriesList();
    });

    document.getElementById("inquiries-list-view").hidden = true;
    document.getElementById("inquiries-detail-view").hidden = false;
  }

  function renderInquiriesList() {
    document.getElementById("inquiries-list").innerHTML = allInquiries.map(i => `
      <div class="inquiry-row" data-id="${i.id}">
        <div>
          <div>${i.email} · ${i.subject}</div>
          <div class="inquiry-meta">${new Date(i.created_at).toLocaleString()}</div>
        </div>
        <span class="${i.reply ? "status-paid" : "muted"}">${i.reply ? "답변완료" : "답변대기"}</span>
      </div>
    `).join("");

    document.querySelectorAll("#inquiries-list .inquiry-row").forEach(row => {
      row.addEventListener("click", () => showInquiryDetail(row.dataset.id));
    });
  }

  document.getElementById("inquiries-back-btn").addEventListener("click", showInquiriesList);

  async function loadInquiries() {
    const { data: inquiries, error } = await supabaseClient
      .from("inquiries")
      .select("*")
      .order("created_at", { ascending: false });

    if (error || !inquiries.length) {
      document.getElementById("inquiries-empty").hidden = false;
      if (error) document.getElementById("inquiries-empty").textContent = "불러오기 실패: " + error.message;
      return;
    }

    allInquiries = inquiries;
    renderInquiriesList();
  }

  async function loadLoginHistory() {
    const { data: logins, error } = await supabaseClient
      .from("login_events")
      .select("*")
      .order("logged_in_at", { ascending: false });

    if (error || !logins.length) {
      document.getElementById("logins-empty").hidden = false;
      if (error) document.getElementById("logins-empty").textContent = "불러오기 실패: " + error.message;
      return;
    }

    document.getElementById("logins-body").innerHTML = logins.map(l => `
      <tr>
        <td data-label="사용자">${l.email}</td>
        <td data-label="로그인 시간">${new Date(l.logged_in_at).toLocaleString()}</td>
      </tr>
    `).join("");
  }

  async function loadProductStats() {
    const { data: views, error } = await supabaseClient
      .from("product_views")
      .select("*");

    if (error || !views.length) {
      document.getElementById("productstats-empty").hidden = false;
      if (error) document.getElementById("productstats-empty").textContent = "불러오기 실패: " + error.message;
      return;
    }

    const byProduct = {};
    views.forEach(v => {
      if (!byProduct[v.product_name]) byProduct[v.product_name] = { count: 0, total: 0 };
      byProduct[v.product_name].count += 1;
      byProduct[v.product_name].total += v.duration_seconds;
    });

    const rows = Object.entries(byProduct).sort((a, b) => b[1].count - a[1].count);
    document.getElementById("productstats-body").innerHTML = rows.map(([name, stat]) => `
      <tr>
        <td data-label="상품">${name}</td>
        <td data-label="조회 수">${stat.count}회</td>
        <td data-label="평균 조회시간">${Math.round(stat.total / stat.count)}초</td>
        <td data-label="총 조회시간">${stat.total}초</td>
      </tr>
    `).join("");
  }

  async function loadAdmin() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      location.href = "login.html";
      return;
    }

    // 화면 안내용 체크일 뿐, 실제 데이터 접근 제한은 DB의 RLS 정책이 담당함
    if (user.email !== ADMIN_EMAIL) {
      document.getElementById("denied").hidden = false;
      return;
    }

    document.getElementById("admin-body").hidden = false;
    document.querySelectorAll(".category-list button[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    await loadOrders();
    await loadInquiries();
    await loadLoginHistory();
    await loadProductStats();
  }

  loadAdmin();
</script>
</body>
</html>
