<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | 지후네 하우스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap wrap-wide">
  <h1>관리자</h1>
  <p id="denied" class="error" hidden>관리자만 볼 수 있는 페이지입니다. (admin@admin.com 계정으로 로그인하세요)</p>

  <div id="admin-body" class="shop-layout" hidden>
    <div class="category-list">
      <button data-tab="orders" class="active">결제내역</button>
      <button data-tab="inquiries">문의내역</button>
      <button data-tab="logins">로그인이력</button>
      <button data-tab="productstats">상품통계</button>
      <button data-tab="addproduct">상품추가</button>
    </div>
    <div class="shop-content">
      <div class="card">
        <table id="orders-table">
          <thead>
            <tr><th>사용자</th><th>상품</th><th>금액</th><th>상태</th><th>결제일시</th></tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
        <p id="orders-empty" class="muted" hidden>결제 내역이 없습니다.</p>
      </div>

      <div class="card" id="inquiries-panel" hidden>
        <div id="inquiries-list-view">
          <div id="inquiries-list"></div>
          <p id="inquiries-empty" class="muted" hidden>문의 내역이 없습니다.</p>
        </div>
        <div id="inquiries-detail-view" hidden>
          <button type="button" id="inquiries-back-btn" class="muted" style="background:none; border:none; cursor:pointer; padding:0; margin-bottom:12px;">&larr; 목록으로</button>
          <div id="inquiry-detail-content"></div>
        </div>
      </div>

      <div class="card" id="logins-panel" hidden>
        <table id="logins-table">
          <thead>
            <tr><th>사용자</th><th>로그인 시간</th></tr>
          </thead>
          <tbody id="logins-body"></tbody>
        </table>
        <p id="logins-empty" class="muted" hidden>로그인 이력이 없습니다.</p>
      </div>

      <div class="card" id="productstats-panel" hidden>
        <table id="productstats-table">
          <thead>
            <tr><th>상품</th><th>조회 수</th><th>평균 조회시간</th><th>총 조회시간</th></tr>
          </thead>
          <tbody id="productstats-body"></tbody>
        </table>
        <p id="productstats-empty" class="muted" hidden>조회 기록이 없습니다.</p>
      </div>

      <div class="card" id="addproduct-panel" hidden>
        <div id="products-list-view">
          <button type="button" class="primary" id="products-new-btn" style="width:100%; margin-bottom:12px;">+ 새 상품 추가</button>
          <div id="admin-products-list"></div>
          <p id="products-empty" class="muted" hidden>등록된 상품이 없습니다.</p>
        </div>
        <div id="products-detail-view" hidden>
          <button type="button" id="products-back-btn" class="muted" style="background:none; border:none; cursor:pointer; padding:0; margin-bottom:12px;">&larr; 목록으로</button>
          <h3 id="product-form-title" style="margin-top:0;">상품 추가</h3>
          <select id="new-product-category">
            <option value="cosmetics">화장품</option>
            <option value="menswear">남성 의류</option>
            <option value="womenswear">여성 의류</option>
          </select>
          <input id="new-product-name" type="text" placeholder="상품명">
          <input id="new-product-price" type="number" placeholder="가격">
          <label class="muted" style="display:block; margin-top:12px;">대표 사진 (수정 시 비워두면 기존 사진 유지)</label>
          <input id="new-product-image" type="file" accept="image/*">
          <label class="muted" style="display:block; margin-top:12px;">상세 사진 (최대 6장, 수정 시 비워두면 기존 사진 유지)</label>
          <input id="new-product-detail-images" type="file" accept="image/*" multiple>
          <button class="primary" id="new-product-submit" style="width:100%; margin-top:16px;">상품 등록</button>
          <button type="button" id="product-delete-btn" hidden style="width:100%; margin-top:8px;">상품 삭제</button>
          <p id="new-product-status" class="muted"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script>
  const ADMIN_EMAIL = "admin@admin.com";

  function switchTab(tab) {
    document.querySelectorAll(".category-list button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === tab);
    });
    document.getElementById("orders-table").closest(".card").hidden = tab !== "orders";
    document.getElementById("inquiries-panel").hidden = tab !== "inquiries";
    document.getElementById("logins-panel").hidden = tab !== "logins";
    document.getElementById("productstats-panel").hidden = tab !== "productstats";
    document.getElementById("addproduct-panel").hidden = tab !== "addproduct";
  }

  async function loadOrders() {
    const { data: orders, error } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", { ascending: false });

    if (error || !orders.length) {
      document.getElementById("orders-empty").hidden = false;
      if (error) document.getElementById("orders-empty").textContent = "불러오기 실패: " + error.message;
      return;
    }

    document.getElementById("orders-body").innerHTML = orders.map(o => `
      <tr>
        <td data-label="사용자">${o.user_email ?? o.user_id}</td>
        <td data-label="상품">${o.product_name}</td>
        <td data-label="금액">${o.amount.toLocaleString()}원</td>
        <td data-label="상태" class="status-paid">${o.status}</td>
        <td data-label="결제일시">${new Date(o.created_at).toLocaleString()}</td>
      </tr>
    `).join("");
  }

  let allInquiries = [];

  function showInquiriesList() {
    document.getElementById("inquiries-list-view").hidden = false;
    document.getElementById("inquiries-detail-view").hidden = true;
  }

  function showInquiryDetail(id) {
    const item = allInquiries.find(i => i.id === id);
    document.getElementById("inquiry-detail-content").innerHTML = `
      <div class="inquiry-meta">${item.email} · ${item.subject} · ${new Date(item.created_at).toLocaleString()}</div>
      <div class="inquiry-message">${item.message}</div>
      ${item.reply ? `<div class="inquiry-reply-done"><strong>답변</strong> (${new Date(item.replied_at).toLocaleString()})<br>${item.reply}</div>` : ""}
      <textarea id="reply-input" rows="3" placeholder="답변 내용">${item.reply ?? ""}</textarea>
      <button class="primary" id="reply-submit">${item.reply ? "답변 수정" : "답변 등록"}</button>
      <p id="reply-status" class="muted"></p>
    `;

    document.getElementById("reply-submit").addEventListener("click", async () => {
      const reply = document.getElementById("reply-input").value;
      const statusEl = document.getElementById("reply-status");

      if (!reply) {
        statusEl.textContent = "답변 내용을 입력해 주세요.";
        return;
      }

      const replied_at = new Date().toISOString();
      const { error } = await supabaseClient
        .from("inquiries")
        .update({ reply, replied_at })
        .eq("id", id);

      if (error) {
        statusEl.textContent = "저장 실패: " + error.message;
        return;
      }

      item.reply = reply;
      item.replied_at = replied_at;
      statusEl.textContent = "답변이 저장되었습니다.";
      renderInquiriesList();
    });

    document.getElementById("inquiries-list-view").hidden = true;
    document.getElementById("inquiries-detail-view").hidden = false;
  }

  function renderInquiriesList() {
    document.getElementById("inquiries-list").innerHTML = allInquiries.map(i => `
      <div class="inquiry-row" data-id="${i.id}">
        <div>
          <div>${i.email} · ${i.subject}</div>
          <div class="inquiry-meta">${new Date(i.created_at).toLocaleString()}</div>
        </div>
        <span class="${i.reply ? "status-paid" : "muted"}">${i.reply ? "답변완료" : "답변대기"}</span>
      </div>
    `).join("");

    document.querySelectorAll("#inquiries-list .inquiry-row").forEach(row => {
      row.addEventListener("click", () => showInquiryDetail(row.dataset.id));
    });
  }

  document.getElementById("inquiries-back-btn").addEventListener("click", showInquiriesList);

  async function loadInquiries() {
    const { data: inquiries, error } = await supabaseClient
      .from("inquiries")
      .select("*")
      .order("created_at", { ascending: false });

    if (error || !inquiries.length) {
      document.getElementById("inquiries-empty").hidden = false;
      if (error) document.getElementById("inquiries-empty").textContent = "불러오기 실패: " + error.message;
      return;
    }

    allInquiries = inquiries;
    renderInquiriesList();
  }

  async function loadLoginHistory() {
    const { data: logins, error } = await supabaseClient
      .from("login_events")
      .select("*")
      .order("logged_in_at", { ascending: false });

    if (error || !logins.length) {
      document.getElementById("logins-empty").hidden = false;
      if (error) document.getElementById("logins-empty").textContent = "불러오기 실패: " + error.message;
      return;
    }

    document.getElementById("logins-body").innerHTML = logins.map(l => `
      <tr>
        <td data-label="사용자">${l.email}</td>
        <td data-label="로그인 시간">${new Date(l.logged_in_at).toLocaleString()}</td>
      </tr>
    `).join("");
  }

  async function loadProductStats() {
    const { data: views, error } = await supabaseClient
      .from("product_views")
      .select("*");

    if (error || !views.length) {
      document.getElementById("productstats-empty").hidden = false;
      if (error) document.getElementById("productstats-empty").textContent = "불러오기 실패: " + error.message;
      return;
    }

    const byProduct = {};
    views.forEach(v => {
      if (!byProduct[v.product_name]) byProduct[v.product_name] = { count: 0, total: 0 };
      byProduct[v.product_name].count += 1;
      byProduct[v.product_name].total += v.duration_seconds;
    });

    const rows = Object.entries(byProduct).sort((a, b) => b[1].count - a[1].count);
    document.getElementById("productstats-body").innerHTML = rows.map(([name, stat]) => `
      <tr>
        <td data-label="상품">${name}</td>
        <td data-label="조회 수">${stat.count}회</td>
        <td data-label="평균 조회시간">${Math.round(stat.total / stat.count)}초</td>
        <td data-label="총 조회시간">${stat.total}초</td>
      </tr>
    `).join("");
  }

  const CATEGORY_LABELS = { cosmetics: "화장품", menswear: "남성 의류", womenswear: "여성 의류" };
  let allProducts = [];
  let editingProductId = null;

  async function uploadProductImage(file) {
    const ext = file.name.split(".").pop();
    const path = `${crypto.randomUUID()}.${ext}`;
    const { error } = await supabaseClient.storage.from("product-images").upload(path, file);
    if (error) throw error;
    const { data } = supabaseClient.storage.from("product-images").getPublicUrl(path);
    return data.publicUrl;
  }

  function showProductsList() {
    document.getElementById("products-list-view").hidden = false;
    document.getElementById("products-detail-view").hidden = true;
  }

  function showProductForm() {
    document.getElementById("products-list-view").hidden = true;
    document.getElementById("products-detail-view").hidden = false;
  }

  function renderProductsList() {
    document.getElementById("products-empty").hidden = allProducts.length > 0;
    document.getElementById("admin-products-list").innerHTML = allProducts.map(p => `
      <div class="inquiry-row" data-id="${p.id}">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="width:36px; height:36px; border-radius:8px; flex-shrink:0; background:${p.image_url ? `url('${p.image_url}') center/cover` : p.gradient};"></div>
          <div>
            <div>${p.name}</div>
            <div class="inquiry-meta">${CATEGORY_LABELS[p.category_id] || p.category_id} · ${p.price.toLocaleString()}원</div>
          </div>
        </div>
      </div>
    `).join("");

    document.querySelectorAll("#admin-products-list .inquiry-row").forEach(row => {
      row.addEventListener("click", () => openProductForEdit(row.dataset.id));
    });
  }

  async function loadProductsList() {
    const { data, error } = await supabaseClient.from("products").select("*").order("created_at", { ascending: false });
    allProducts = error ? [] : data;
    renderProductsList();
  }

  function resetProductForm() {
    editingProductId = null;
    document.getElementById("new-product-category").value = "cosmetics";
    document.getElementById("new-product-name").value = "";
    document.getElementById("new-product-price").value = "";
    document.getElementById("new-product-image").value = "";
    document.getElementById("new-product-detail-images").value = "";
    document.getElementById("product-form-title").textContent = "상품 추가";
    document.getElementById("new-product-submit").textContent = "상품 등록";
    document.getElementById("product-delete-btn").hidden = true;
    document.getElementById("new-product-status").textContent = "";
  }

  function openProductForEdit(id) {
    const p = allProducts.find(x => x.id === id);
    editingProductId = id;
    document.getElementById("new-product-category").value = p.category_id;
    document.getElementById("new-product-name").value = p.name;
    document.getElementById("new-product-price").value = p.price;
    document.getElementById("new-product-image").value = "";
    document.getElementById("new-product-detail-images").value = "";
    document.getElementById("product-form-title").textContent = "상품 수정";
    document.getElementById("new-product-submit").textContent = "수정 저장";
    document.getElementById("product-delete-btn").hidden = false;
    document.getElementById("new-product-status").textContent = "";
    showProductForm();
  }

  document.getElementById("products-new-btn").addEventListener("click", () => {
    resetProductForm();
    showProductForm();
  });

  document.getElementById("products-back-btn").addEventListener("click", showProductsList);

  function extractStoragePath(url) {
    const marker = "/product-images/";
    const idx = url.indexOf(marker);
    return idx === -1 ? null : url.slice(idx + marker.length);
  }

  document.getElementById("product-delete-btn").addEventListener("click", async () => {
    if (!editingProductId || !confirm("정말 삭제하시겠어요?")) return;
    const product = allProducts.find(p => p.id === editingProductId);
    const { error } = await supabaseClient.from("products").delete().eq("id", editingProductId);
    if (error) { alert("삭제 실패: " + error.message); return; }

    const paths = [product.image_url, ...(product.detail_image_urls || [])]
      .filter(Boolean)
      .map(extractStoragePath)
      .filter(Boolean);
    if (paths.length) await supabaseClient.storage.from("product-images").remove(paths);

    await loadProductsList();
    showProductsList();
  });

  document.getElementById("new-product-submit").addEventListener("click", async () => {
    const statusEl = document.getElementById("new-product-status");
    const category_id = document.getElementById("new-product-category").value;
    const name = document.getElementById("new-product-name").value.trim();
    const price = Number(document.getElementById("new-product-price").value);
    const imageFile = document.getElementById("new-product-image").files[0];
    const detailFiles = Array.from(document.getElementById("new-product-detail-images").files);

    if (!name || !price || (!editingProductId && !imageFile)) {
      statusEl.textContent = "상품명, 가격, 대표 사진은 필수입니다.";
      return;
    }
    if (detailFiles.length > 6) {
      statusEl.textContent = "상세 사진은 최대 6장까지 업로드할 수 있습니다.";
      return;
    }

    const previousProduct = editingProductId ? allProducts.find(p => p.id === editingProductId) : null;

    statusEl.textContent = "저장 중...";
    try {
      const payload = { category_id, name, price };
      if (imageFile) payload.image_url = await uploadProductImage(imageFile);
      if (detailFiles.length) {
        const detail_image_urls = [];
        for (const file of detailFiles) detail_image_urls.push(await uploadProductImage(file));
        payload.detail_image_urls = detail_image_urls;
      }

      if (editingProductId) {
        const { error } = await supabaseClient.from("products").update(payload).eq("id", editingProductId);
        if (error) throw error;

        // 새 사진으로 교체된 경우에만 이전 사진 파일을 Storage에서 지움
        const replacedUrls = [];
        if (imageFile && previousProduct.image_url) replacedUrls.push(previousProduct.image_url);
        if (detailFiles.length) replacedUrls.push(...(previousProduct.detail_image_urls || []));
        const oldPaths = replacedUrls.map(extractStoragePath).filter(Boolean);
        if (oldPaths.length) await supabaseClient.storage.from("product-images").remove(oldPaths);
      } else {
        const { error } = await supabaseClient.from("products").insert({ detail_image_urls: [], ...payload });
        if (error) throw error;
      }

      await loadProductsList();
      showProductsList();
    } catch (err) {
      statusEl.textContent = "저장 실패: " + err.message;
    }
  });

  async function loadAdmin() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      location.href = "login.html";
      return;
    }

    // 화면 안내용 체크일 뿐, 실제 데이터 접근 제한은 DB의 RLS 정책이 담당함
    if (user.email !== ADMIN_EMAIL) {
      document.getElementById("denied").hidden = false;
      return;
    }

    document.getElementById("admin-body").hidden = false;
    document.querySelectorAll(".category-list button[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    await loadOrders();
    await loadInquiries();
    await loadLoginHistory();
    await loadProductStats();
    await loadProductsList();
  }

  loadAdmin();
</script>
</body>
</html>
