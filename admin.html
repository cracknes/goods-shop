<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | 굿즈샵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>관리자 - 전체 결제내역</h1>
  <div class="card">
    <p id="denied" class="error" hidden>관리자만 볼 수 있는 페이지입니다. (admin@admin.com 계정으로 로그인하세요)</p>
    <table id="orders-table" hidden>
      <thead>
        <tr><th>사용자</th><th>상품</th><th>금액</th><th>상태</th><th>결제일시</th></tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
    <p id="empty-message" class="muted" hidden>결제 내역이 없습니다.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script>
  const ADMIN_EMAIL = "admin@admin.com";

  async function loadAdmin() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      location.href = "login.html";
      return;
    }

    // 화면 안내용 체크일 뿐, 실제 데이터 접근 제한은 DB의 RLS 정책이 담당함
    if (user.email !== ADMIN_EMAIL) {
      document.getElementById("denied").hidden = false;
      return;
    }

    const { data: orders, error } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      document.getElementById("denied").hidden = false;
      document.getElementById("denied").textContent = "불러오기 실패: " + error.message;
      return;
    }

    if (!orders.length) {
      document.getElementById("empty-message").hidden = false;
      return;
    }

    document.getElementById("orders-table").hidden = false;
    document.getElementById("orders-body").innerHTML = orders.map(o => `
      <tr>
        <td>${o.user_email ?? o.user_id}</td>
        <td>${o.product_name}</td>
        <td>${o.amount.toLocaleString()}원</td>
        <td class="status-paid">${o.status}</td>
        <td>${new Date(o.created_at).toLocaleString()}</td>
      </tr>
    `).join("");
  }

  loadAdmin();
</script>
</body>
</html>
