<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 결제내역 | 지우네 하우스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>내 결제내역</h1>
  <div class="card">
    <table id="orders-table">
      <thead>
        <tr><th>상품</th><th>금액</th><th>상태</th><th>결제일시</th></tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
    <p id="empty-message" class="muted" hidden>아직 결제 내역이 없습니다.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script>
  async function loadOrders() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      location.href = "login.html";
      return;
    }

    const { data: orders, error } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      document.getElementById("empty-message").hidden = false;
      document.getElementById("empty-message").textContent = "불러오기 실패: " + error.message;
      return;
    }

    if (!orders.length) {
      document.getElementById("empty-message").hidden = false;
      return;
    }

    document.getElementById("orders-body").innerHTML = orders.map(o => `
      <tr>
        <td data-label="상품">${o.product_name}</td>
        <td data-label="금액">${o.amount.toLocaleString()}원</td>
        <td data-label="상태" class="status-paid">${o.status}</td>
        <td data-label="결제일시">${new Date(o.created_at).toLocaleString()}</td>
      </tr>
    `).join("");
  }

  loadOrders();
</script>
</body>
</html>
