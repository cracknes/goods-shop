<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b9e92">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>마이 | 지후네 하우스</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/static/split/WantedSans.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<nav id="bottom-nav" class="bottom-nav"></nav>
<div class="wrap">
  <div class="mypage-hello">
    <p class="mypage-hello-greet">안녕하세요 👋</p>
    <p class="mypage-hello-sub">마이 메뉴에서 정보를 관리하세요</p>
  </div>
  <div class="mypage-grid">
    <a class="mypage-card" href="profile.html">
      <span class="mypage-card-icon">🙍</span>
      <span class="mypage-card-label">회원정보 수정</span>
      <span class="mypage-card-desc">이름·연락처·비밀번호</span>
    </a>
    <a class="mypage-card" href="orders.html">
      <span class="mypage-card-icon">🧾</span>
      <span class="mypage-card-label">결제내역</span>
      <span class="mypage-card-desc">주문·구매 기록 확인</span>
    </a>
    <a class="mypage-card" href="news-settings.html">
      <span class="mypage-card-icon">📰</span>
      <span class="mypage-card-label">오늘의 뉴스 관리</span>
      <span class="mypage-card-desc">내 바로가기 카드 설정</span>
    </a>
    <!-- 알림이 끊겼을 때(구독 만료 등) 언제든 다시 구독할 수 있는 버튼. 메인화면 "알림 받기" 카드는
         한 번 결정하면 다시 안 뜨는 1회성이라, 끊긴 뒤 복구할 고정된 자리가 필요해서 만듦. -->
    <button type="button" class="mypage-card" id="push-resubscribe-btn" style="font-family:inherit; cursor:pointer;">
      <span class="mypage-card-icon">🔔</span>
      <span class="mypage-card-label">알림 다시 설정</span>
      <span class="mypage-card-desc" id="push-resubscribe-status">알림이 안 올 때 눌러주세요</span>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="bottom-nav.js"></script>
<script src="pwa.js"></script>
<script>
  (async function initPage() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) location.href = "login.html";
  })();

  document.getElementById("push-resubscribe-btn").addEventListener("click", async () => {
    const statusEl = document.getElementById("push-resubscribe-status");
    if (!isPushSupported()) {
      statusEl.textContent = "이 브라우저는 알림을 지원하지 않아요";
      return;
    }
    if (Notification.permission === "denied") {
      statusEl.textContent = "알림이 차단돼 있어요. 휴대폰/브라우저 설정에서 이 사이트 알림을 허용해주세요";
      return;
    }
    statusEl.textContent = "설정 중…";
    try {
      // subscribeToPush는 기존 구독을 해지하고 항상 새로 구독한 뒤 서버에 저장함(pwa.js)
      const sub = await subscribeToPush();
      statusEl.textContent = sub ? "알림을 다시 설정했어요 ✅" : "알림 권한이 허용되지 않았어요";
    } catch (err) {
      statusEl.textContent = "설정 실패: " + err.message;
    }
  });
</script>
</body>
</html>
