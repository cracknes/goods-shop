<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>로그인 | 지후네 하우스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>로그인</h1>

  <div class="card">
    <input id="email" type="email" placeholder="이메일 전체 주소 (예: tester4@naver.com)">
    <input id="password" type="password" placeholder="비밀번호">
    <button class="primary" id="login-btn" style="width:100%;">로그인</button>
    <p id="message" class="error"></p>
  </div>

  <div class="card">
    <div id="social-buttons" class="social-buttons"></div>
  </div>

  <p class="muted">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="pwa.js"></script>
<script src="social-auth.js"></script>
<script>
  const messageEl = document.getElementById("message");

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      messageEl.textContent = error.code === "invalid_credentials"
        ? "이메일 또는 비밀번호가 올바르지 않습니다."
        : error.message;
      return;
    }
    await recordLogin(data.user);
    location.href = "index.html";
  });

  renderSocialButtons("social-buttons");
</script>
</body>
</html>
