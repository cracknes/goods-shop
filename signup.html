<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | 노르덴돌프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>회원가입</h1>

  <div class="card">
    <div id="social-buttons" class="social-buttons"></div>
  </div>

  <p class="muted" style="text-align:center;">또는 이메일로 가입</p>

  <div class="card">
    <input id="email" type="email" placeholder="이메일">
    <input id="password" type="password" placeholder="비밀번호 (6자 이상)">
    <button class="primary" id="signup-btn" style="width:100%;">회원가입</button>
    <p id="message" class="error"></p>
  </div>

  <p class="muted">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="social-auth.js"></script>
<script>
  const messageEl = document.getElementById("message");

  document.getElementById("signup-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const { error } = await supabaseClient.auth.signUp({ email, password });
    if (error) { messageEl.textContent = error.message; return; }
    messageEl.classList.remove("error");
    messageEl.classList.add("muted");
    messageEl.textContent = "가입 완료! 이제 로그인해 주세요.";
  });

  renderSocialButtons("social-buttons");
</script>
</body>
</html>
