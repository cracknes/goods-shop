<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | 노르덴돌프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>회원가입</h1>

  <div class="card">
    <div id="social-buttons" class="social-buttons"></div>
  </div>

  <p class="muted" style="text-align:center;">또는 이메일로 가입</p>

  <div class="card">
    <input id="name" type="text" placeholder="이름">
    <input id="phone" type="tel" placeholder="전화번호 (예: 010-1234-5678)">
    <div class="email-row">
      <input id="email-local" type="text" placeholder="이메일">
      <span>@</span>
      <select id="email-domain">
        <option value="naver.com">naver.com</option>
        <option value="gmail.com">gmail.com</option>
        <option value="kakao.com">kakao.com</option>
        <option value="hanmail.net">hanmail.net</option>
      </select>
    </div>
    <select id="gender">
      <option value="">성별 선택</option>
      <option value="male">남성</option>
      <option value="female">여성</option>
      <option value="prefer_not_to_say">선택 안 함</option>
    </select>
    <input id="password" type="password" placeholder="비밀번호 (6자 이상)">
    <button class="primary" id="signup-btn" style="width:100%;">회원가입</button>
    <p id="message" class="error"></p>
  </div>

  <p class="muted">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="social-auth.js"></script>
<script>
  const messageEl = document.getElementById("message");

  document.getElementById("signup-btn").addEventListener("click", async () => {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const emailLocal = document.getElementById("email-local").value;
    const emailDomain = document.getElementById("email-domain").value;
    const email = emailLocal && emailDomain ? `${emailLocal}@${emailDomain}` : "";
    const gender = document.getElementById("gender").value;
    const password = document.getElementById("password").value;

    if (!name || !phone || !email || !gender || !password) {
      messageEl.textContent = "이름, 전화번호, 이메일, 성별, 비밀번호를 모두 입력해 주세요.";
      return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: { data: { name, phone, gender } },
    });

    if (error) {
      if (error.code === "user_already_exists") {
        messageEl.textContent = "이미 가입된 이메일입니다. 로그인해 주세요.";
      } else {
        messageEl.textContent = error.message;
      }
      return;
    }

    // 에러 없이도 실제 계정 정보(data.user.id)가 없는 애매한 응답이면 성공으로 취급하지 않음
    if (!data.user || !data.user.id) {
      messageEl.textContent = "가입 처리 중 문제가 발생했습니다. 다시 시도해 주세요.";
      return;
    }

    // Supabase는 보안상 이미 가입된 이메일이어도 에러 없이 "성공"처럼 응답할 때가 있음
    // (identities가 비어있으면 신규 계정이 아니라 기존 계정이라는 뜻)
    if (data.user.identities && data.user.identities.length === 0) {
      messageEl.textContent = "이미 가입된 이메일입니다. 로그인해 주세요.";
      return;
    }

    // 가입과 동시에 로그인 세션도 이미 생성됨 (mailer_autoconfirm) — 다시 로그인시킬 필요 없음
    await recordLogin(data.user);
    alert("가입이 완료되었습니다.");
    location.href = "index.html";
  });

  renderSocialButtons("social-buttons");
</script>
</body>
</html>
