<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | 노르덴돌프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>회원가입</h1>

  <div class="card">
    <div id="social-buttons" class="social-buttons"></div>
  </div>

  <p class="muted" style="text-align:center;">또는 이메일로 가입</p>

  <div class="card">
    <input id="name" type="text" placeholder="이름">
    <input id="phone" type="tel" placeholder="전화번호 (예: 010-1234-5678)">
    <div class="email-row">
      <input id="email-local" type="text" placeholder="이메일 아이디">
      <span>@</span>
      <select id="email-domain">
        <option value="naver.com">naver.com</option>
        <option value="gmail.com">gmail.com</option>
        <option value="kakao.com">kakao.com</option>
        <option value="hanmail.net">hanmail.net</option>
      </select>
    </div>
    <select id="gender">
      <option value="">성별 선택</option>
      <option value="male">남성</option>
      <option value="female">여성</option>
      <option value="prefer_not_to_say">선택 안 함</option>
    </select>
    <input id="password" type="password" placeholder="비밀번호 (6자 이상)">
    <button class="primary" id="signup-btn" style="width:100%;">회원가입</button>
    <p id="message" class="error"></p>
  </div>

  <p class="muted">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="social-auth.js"></script>
<script>
  const messageEl = document.getElementById("message");

  document.getElementById("signup-btn").addEventListener("click", async () => {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const emailLocal = document.getElementById("email-local").value;
    const emailDomain = document.getElementById("email-domain").value;
    const email = emailLocal && emailDomain ? `${emailLocal}@${emailDomain}` : "";
    const gender = document.getElementById("gender").value;
    const password = document.getElementById("password").value;

    if (!name || !phone || !email || !gender || !password) {
      messageEl.textContent = "이름, 전화번호, 이메일, 성별, 비밀번호를 모두 입력해 주세요.";
      return;
    }

    const { error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: { data: { name, phone, gender } },
    });
    if (error) { messageEl.textContent = error.message; return; }
    alert("가입이 완료되었습니다. 로그인 화면으로 이동합니다.");
    location.href = "login.html";
  });

  renderSocialButtons("social-buttons");
</script>
</body>
</html>
