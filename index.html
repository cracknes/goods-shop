  async function loadMenus() {
    const { data, error } = await supabaseClient.from("menus").select("*").order("sort_order");

    allMenuItems = data;

  }

  function renderCategoryList() {
    const list = document.getElementById("category-list");
    const items = allMenuItems.filter(m => m.visible);

    list.innerHTML = items.map(item => `

    list.querySelectorAll("button[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        renderCategoryList();
        renderMainContent();
      });
    });
  }

  function renderMainContent() {
    if (!activeCategory) {
      document.getElementById("products").style.display = "block";

    if (activeCategory === "game") {
      renderHangulGame();
      return;
    }
    if (activeCategory === "numbergame") {
      renderNumberGame();
      return;
    }
    if (activeCategory === "news") {
      renderNewsMenu();
      return;

    renderProducts();

  // 아이용 한글 놀이: (1) 따라쓰기 - 화면에 뜬 단어를 그대로 입력, (2) 퀴즈 - 6세 아이가 알 만한 간단한 수수께끼
  const HANGUL_WORDS = ["사과", "바나나", "나비", "우유", "고양이", "강아지", "학교", "나무", "하늘", "바다"];

  function decomposeHangulTyping(word) {
    const keys = [];
    for (const ch of word) {
      const code = ch.charCodeAt(0) - 0xAC00;
      if (code < 0 || code > 11171) { keys.push(ch); continue; } // 완성형 한글 음절이 아니면 그대로
      const cho = HANGUL_CHO[Math.floor(code / (21 * 28))];
      const jung = HANGUL_JUNG[Math.floor((code % (21 * 28)) / 28)];
      const jong = HANGUL_JONG[code % 28];
      keys.push(cho, ...(HANGUL_JUNG_SPLIT[jung] ?? [jung]));
      if (jong) keys.push(...(HANGUL_JONG_SPLIT[jong] ?? [jong]));
    }
    return keys.join(" ");

    { question: "프랑스를 위기에서 구한 소녀 영웅은 누구일까요?", answer: "잔 다르크", hint: "갑옷을 입고 전쟁에 나갔어요" },
    { question: "세계일주 항해를 이끈 탐험가는 누구일까요?", answer: "마젤란", hint: "배가 지구를 한 바퀴 돌았어요" },

    { question: "곰팡이에서 페니실린을 발견한 과학자는 누구일까요?", answer: "플레밍", hint: "최초의 항생제를 발견했어요" },
    { question: "완두콩으로 유전의 법칙을 발견한 과학자는 누구일까요?", answer: "멘델", hint: "수도원에서 완두콩을 길렀어요" },
    { question: "교류 전기를 연구한 과학자는 누구일까요?", answer: "테슬라", hint: "전기자동차 회사의 이름이 되기도 했어요" },
    { question: "달에 처음 발을 디딘 우주비행사는 누구일까요?", answer: "닐 암스트롱", hint: "'인류의 위대한 도약'이라는 말을 남겼어요" },
    { question: "인류 최초로 우주를 비행한 사람은 누구일까요?", answer: "유리 가가린", hint: "소련의 우주비행사예요" },
    { question: "몽골 제국을 세운 정복자는 누구일까요?", answer: "칭기즈칸", hint: "역사상 가장 넓은 땅을 다스렸어요" },
    { question: "해바라기 그림을 그린 화가는 누구일까요?", answer: "반 고흐", hint: "네덜란드 출신 화가예요" },
    { question: "트럼펫을 연주한 유명한 재즈 음악가는 누구일까요?", answer: "루이 암스트롱", hint: "허스키한 목소리로 노래도 불렀어요" },
    { question: "휠체어를 타고 블랙홀을 연구한 과학자는 누구일까요?", answer: "스티븐 호킹", hint: "'시간의 역사'라는 책을 썼어요" },
  ];
  let gameIndex = 0;
  let gameScore = 0;
  let hangulMode = "copy"; // "copy" | "quiz" | "wiin"
  let quizScore = 0;
  let currentQuiz = null;
  let wiinScore = 0;
  let currentWiinQuiz = null;
  let wiinCategory = "kr"; // "kr" | "world"
  let drawGameIndex = 0;
  let drawScore = 0;
  let copySubMode = "keyboard"; // "keyboard" | "pencil" — 따라쓰기 안의 하위 탭(타이핑 연습 / 애플펜슬 따라그리기)

  // 바로 직전 문제와 같은 게 연달아 나오지 않도록 무작위로 다음 퀴즈를 고름
  function pickNextQuiz() {
    if (HANGUL_QUIZZES.length === 1) { currentQuiz = HANGUL_QUIZZES[0]; return; }
    let next;
    do {
      next = HANGUL_QUIZZES[Math.floor(Math.random() * HANGUL_QUIZZES.length)];
    } while (next === currentQuiz);
    currentQuiz = next;
  }

  function pickNextWiinQuiz() {
    const pool = wiinCategory === "kr" ? KR_WIIN_QUIZZES : WORLD_WIIN_QUIZZES;
    if (pool.length === 1) { currentWiinQuiz = pool[0]; return; }
    let next;
    do {
      next = pool[Math.floor(Math.random() * pool.length)];
    } while (next === currentWiinQuiz);
    currentWiinQuiz = next;
  }

  function renderHangulGame() {
    const container = document.getElementById("products");
    container.style.display = "block"; // 상품 그리드(여러 칸) 대신 한 칸을 꽉 채우게

    const word = HANGUL_WORDS[gameIndex % HANGUL_WORDS.length];
    const drawWord = HANGUL_WORDS[drawGameIndex % HANGUL_WORDS.length];
    if (!currentQuiz) pickNextQuiz();
    const quiz = currentQuiz;
    if (!currentWiinQuiz) pickNextWiinQuiz();
    const wiin = currentWiinQuiz;

    const tabBar = `
      <div class="tab-bar" style="margin-bottom:16px;">
        <button type="button" data-hangulmode="copy" class="${hangulMode === "copy" ? "active" : ""}">따라쓰기</button>
        <button type="button" data-hangulmode="quiz" class="${hangulMode === "quiz" ? "active" : ""}">한글 Quiz</button>
        <button type="button" data-hangulmode="wiin" class="${hangulMode === "wiin" ? "active" : ""}">위인 Quiz</button>
      </div>
    `;

    let content;
    if (hangulMode === "quiz") {
      content = `
        <div class="card" style="width:100%;">
          ${tabBar}
          <h2 style="margin-top:0;">한글 Quiz <span id="hangul-skip-btn">🧩</span> <button type="button" id="hangul-hint-btn" class="hint-btn">?</button></h2>
          <p class="muted" style="text-align:center; font-size:18px; margin:20px 0;">${escapeHtml(quiz.question)}</p>
          <input id="game-input" type="text" placeholder="정답을 입력하세요" autocomplete="off" style="font-size:20px; text-align:center;">
          <button class="primary" id="game-check-btn" style="width:100%;">확인</button>
          <p class="muted" style="text-align:center;">맞춘 개수: ${quizScore}개</p>
        </div>
      `;
    } else if (hangulMode === "wiin") {
      // 사용자가 "외국 위인이 섞여있다"고 지적해서, 위인퀴즈 탭 안에 한국/세계 위인을
      // 고를 수 있는 하위 탭을 추가함(메인 탭은 그대로 3개 유지, 이 안에서만 한 번 더 나뉨).
      const wiinSubTabs = `
        <div class="tab-bar" style="margin-bottom:12px;">
          <button type="button" data-wiincategory="kr" class="${wiinCategory === "kr" ? "active" : ""}">한국 위인</button>
          <button type="button" data-wiincategory="world" class="${wiinCategory === "world" ? "active" : ""}">세계 위인</button>
        </div>
      `;
      content = `
        <div class="card" style="width:100%;">
          ${tabBar}
          ${wiinSubTabs}
          <h2 style="margin-top:0;">위인 Quiz <span id="hangul-skip-btn">🏛️</span> <button type="button" id="hangul-hint-btn" class="hint-btn">?</button></h2>
          <p class="muted" style="text-align:center; font-size:18px; margin:20px 0;">${escapeHtml(wiin.question)}</p>
          <input id="game-input" type="text" placeholder="정답을 입력하세요" autocomplete="off" style="font-size:20px; text-align:center;">
          <button class="primary" id="game-check-btn" style="width:100%;">확인</button>
          <p class="muted" style="text-align:center;">맞춘 개수: ${wiinScore}개</p>
        </div>
      `;
    } else {
      // "그림판"을 별도 메뉴로 뒀다가, 사용자가 "따라쓰기 하위에 키보드/애플펜슬 구성"으로
      // 요청해서 따라쓰기 탭 안의 하위 탭(`copySubMode`)으로 합침(위인 Quiz의 한국/세계 하위
      // 탭과 같은 패턴). 타이핑 연습과 손글씨 연습은 성격이 달라서 점수(`gameScore`/`drawScore`)와
      // 진행 중인 단어(`gameIndex`/`drawGameIndex`)는 각자 따로 유지함.
      const copySubTabs = `
        <div class="tab-bar" style="margin-bottom:12px;">
          <button type="button" data-copysubmode="keyboard" class="${copySubMode === "keyboard" ? "active" : ""}">키보드</button>
          <button type="button" data-copysubmode="pencil" class="${copySubMode === "pencil" ? "active" : ""}">애플펜슬</button>
        </div>
      `;
      if (copySubMode === "pencil") {
        content = `
          <div class="card" style="width:100%;">
            ${tabBar}
            ${copySubTabs}
            <h2 style="margin-top:0;">그림판 <span id="hangul-skip-btn">✏️</span></h2>
            <p class="muted">안내선을 따라 손가락이나 펜으로 글자를 그려보세요!</p>
            <div style="font-size:28px; font-weight:700; text-align:center; margin:8px 0;">${drawWord}</div>
            <div style="position:relative; width:320px; height:320px; max-width:100%; margin:0 auto 12px; touch-action:none;">
              <canvas id="tracing-guide-canvas" width="320" height="320" style="position:absolute; top:0; left:0; border:2px dashed #ccc; border-radius:12px; background:#fff;"></canvas>
              <canvas id="tracing-draw-canvas" width="320" height="320" style="position:absolute; top:0; left:0;"></canvas>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
              <button type="button" id="tracing-clear-btn" class="muted" style="flex:1; background:var(--bg-soft); border:none; border-radius:999px; padding:10px; font-size:14px;">지우기</button>
              <button type="button" id="tracing-check-btn" class="primary" style="flex:1; margin-bottom:0;">쓴 글씨 확인</button>
            </div>
            <p id="tracing-result" class="muted" style="text-align:center; min-height:20px;"></p>
            <p class="muted" style="text-align:center;">맞춘 개수: ${drawScore}개</p>
          </div>
        `;
      } else {
        content = `
          <div class="card" style="width:100%;">
            ${tabBar}
            ${copySubTabs}
            <h2 style="margin-top:0;">한글 놀이 <span id="hangul-skip-btn">🎈</span></h2>
            <p class="muted">아래 글자를 똑같이 따라 입력해보세요!</p>
            <div style="font-size:40px; font-weight:700; text-align:center; margin:12px 0;">${word}</div>
            <p class="muted" style="text-align:center; font-size:15px; letter-spacing:2px; margin-top:0;">${escapeHtml(decomposeHangulTyping(word))}</p>
            <input id="game-input" type="text" placeholder="여기에 입력하세요" autocomplete="off" style="font-size:20px; text-align:center;">
            <button class="primary" id="game-check-btn" style="width:100%;">확인</button>
            <p class="muted" style="text-align:center;">맞춘 개수: ${gameScore}개</p>
          </div>
        `;
      }
    }
    container.innerHTML = content;

    document.querySelectorAll("[data-hangulmode]").forEach(btn => {
      btn.addEventListener("click", () => {
        hangulMode = btn.dataset.hangulmode;
        renderHangulGame();
      });
    });

    document.querySelectorAll("[data-copysubmode]").forEach(btn => {
      btn.addEventListener("click", () => {
        copySubMode = btn.dataset.copysubmode;
        renderHangulGame();
      });
    });

    document.querySelectorAll("[data-wiincategory]").forEach(btn => {
      btn.addEventListener("click", () => {
        wiinCategory = btn.dataset.wiincategory;
        currentWiinQuiz = null; // 카테고리를 바꾸면 그 카테고리 안에서 새로 하나 뽑음
        renderHangulGame();
      });
    });

    const input = document.getElementById("game-input"); // "그림판" 모드엔 없음(아래에서 null 체크)

    function checkAnswer() {
      const correctAnswer = hangulMode === "quiz" ? quiz.answer : hangulMode === "wiin" ? wiin.answer : word;
      if (input.value.trim() === correctAnswer) {
        if (hangulMode === "quiz") { quizScore++; pickNextQuiz(); }
        else if (hangulMode === "wiin") { wiinScore++; pickNextWiinQuiz(); }
        else { gameScore++; gameIndex++; }
        showCelebration(renderHangulGame);
      } else {
        showWrongAnswerAlert();
      }
    }

    // 지금 문제/단어를 점수 변동 없이 바로 다음으로 넘김(네 모드 전부 지원). 처음엔 "⏭️" 같은
    // 별도 버튼으로 만들었는데, 아이가 보자마자 누르고 싶어지는 모양이라 "문제를 끝까지 생각
    // 안 하고 바로 넘겨버리는" 용도로 아이가 직관적으로 써버릴 수 있다는 지적을 받음 — 대신
    // 제목 옆 장식용 이모지(🎈/🧩/🏛️/✏️)를 그냥 누르면 넘어가도록 바꿈. 버튼처럼 안 보이게
    // `.hint-btn` 같은 스타일/커서 변경을 일부러 주지 않아서, 아이 눈에는 그냥 그림일 뿐이고
    // 어른이 알고 눌러야만 쓰이는 숨겨진 기능이 되게 함.
    function skipQuestion() {
      if (hangulMode === "quiz") pickNextQuiz();
      else if (hangulMode === "wiin") pickNextWiinQuiz();
      else if (hangulMode === "copy" && copySubMode === "keyboard") gameIndex++;
      else if (hangulMode === "copy" && copySubMode === "pencil") drawGameIndex++;
      renderHangulGame();
    }

    if (input) {
      document.getElementById("game-check-btn").addEventListener("click", checkAnswer);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") checkAnswer(); });
      input.focus();
    }

    // 그림판 전용 — 애플펜슬/손가락으로 실제로 글자를 따라 그려볼 수 있게 함(따라쓰기와는
    // 별도 메뉴로 분리함 — 타이핑 연습과 손글씨 연습을 따로 고를 수 있게). "잘 썼는지 확인"은
    // 진짜 손글씨 인식(AI 모델 필요)이 아니라, 안내 글자 모양과 얼마나 겹치게 그렸는지를 픽셀
    // 단위로 비교하는 간단한 방식임 — 정확한 글자 인식은 아니지만, "안내선 위를 잘 따라
    // 그렸는지"는 충분히 확인할 수 있어서 이 수준으로 구현함.
    if (hangulMode === "copy" && copySubMode === "pencil") {
      const guideCanvas = document.getElementById("tracing-guide-canvas");
      const drawCanvas = document.getElementById("tracing-draw-canvas");
      const gctx = guideCanvas.getContext("2d");
      const dctx = drawCanvas.getContext("2d");

      gctx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
      gctx.fillStyle = "#d8d8d8";
      gctx.font = "bold 110px sans-serif";
      gctx.textAlign = "center";
      gctx.textBaseline = "middle";
      gctx.fillText(drawWord, guideCanvas.width / 2, guideCanvas.height / 2);
      const guideData = gctx.getImageData(0, 0, guideCanvas.width, guideCanvas.height).data;

      dctx.lineWidth = 10;
      dctx.lineCap = "round";
      dctx.lineJoin = "round";
      dctx.strokeStyle = "#2b2b2b";

      let drawing = false;
      const getPos = (e) => {
        const rect = drawCanvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      };
      drawCanvas.addEventListener("pointerdown", (e) => {
        drawing = true;
        drawCanvas.setPointerCapture(e.pointerId);
        const p = getPos(e);
        dctx.beginPath();
        dctx.moveTo(p.x, p.y);
      });
      drawCanvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = getPos(e);
        dctx.lineTo(p.x, p.y);
        dctx.stroke();
      });
      const stopDrawing = () => { drawing = false; };
      drawCanvas.addEventListener("pointerup", stopDrawing);
      drawCanvas.addEventListener("pointercancel", stopDrawing);
      drawCanvas.addEventListener("pointerleave", stopDrawing);

      const tracingResult = document.getElementById("tracing-result");
      document.getElementById("tracing-clear-btn").addEventListener("click", () => {
        dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        tracingResult.textContent = "";
      });

      document.getElementById("tracing-check-btn").addEventListener("click", () => {
        const drawData = dctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height).data;
        let guideInk = 0, overlapOnGuide = 0, drawInk = 0, overlapOnDraw = 0;
        for (let i = 3; i < guideData.length; i += 4) {
          const isGuide = guideData[i] > 30;
          const isDraw = drawData[i] > 30;
          if (isGuide) { guideInk++; if (isDraw) overlapOnGuide++; }
          if (isDraw) { drawInk++; if (isGuide) overlapOnDraw++; }
        }
        const coverage = guideInk > 0 ? overlapOnGuide / guideInk : 0; // 안내 글자를 얼마나 따라 그렸는지
        const precision = drawInk > 0 ? overlapOnDraw / drawInk : 0; // 그린 것 중 안내선 안쪽 비율
        if (drawInk < 50) {
          tracingResult.style.color = "";
          tracingResult.textContent = "아직 안 그렸어요! 손가락이나 펜으로 위에 따라 그려보세요.";
        } else if (coverage >= 0.45 && precision >= 0.35) {
          drawScore++;
          drawGameIndex++;
          showCelebration(renderHangulGame);
        } else {
          tracingResult.style.color = "";
          tracingResult.textContent = "";
          showWrongAnswerAlert("지후야 다시 따라 그려볼래?");
        }
      });
    }

    const skipBtn = document.getElementById("hangul-skip-btn");
    if (skipBtn) skipBtn.addEventListener("click", skipQuestion);

    const hintBtn = document.getElementById("hangul-hint-btn");
    if (hintBtn) {
      hintBtn.addEventListener("click", () => {
        const hintText = hangulMode === "wiin" ? wiin.hint : quiz.hint;
        document.getElementById("solution-content").innerHTML = `
          <h3 style="margin-top:0;">힌트</h3>
          <p style="font-size:18px;">${escapeHtml(hintText)}</p>
        `;
        document.getElementById("solution-modal").hidden = false;
      });
    }
  }

  // 아이용 숫자 놀이: 덧셈/뺄셈은 한 자리(1~9)와 두 자리(10~99) 숫자를 섞어서 출제
  // 곱셈은 한 자리끼리가 기본이고, 11×11~19×19 같은 동일 두 자리 제곱만 예외로 허용
  let numberScore = 0;

  function generateNumberProblem() {
    const op = ["+", "-", "×"][Math.floor(Math.random() * 3)];

    if (op === "×") {
      if (Math.random() < 0.5) {
        const n = Math.floor(Math.random() * 9) + 11; // 11~19
        return { a: n, b: n, op, answer: n * n };
      }
      const a = Math.floor(Math.random() * 9) + 1;
      const b = Math.floor(Math.random() * 9) + 1;
      return { a, b, op, answer: a * b };
    }

    // 항상 한 자리 하나 + 두 자리 하나로 조합 (둘 다 두 자리가 되지 않게)
    const oneDigit = Math.floor(Math.random() * 9) + 1; // 1~9
    const twoDigit = Math.floor(Math.random() * 90) + 10; // 10~99
    let a = Math.random() < 0.5 ? oneDigit : twoDigit;
    let b = a === oneDigit ? twoDigit : oneDigit;
    if (op === "-" && a < b) [a, b] = [b, a]; // 결과가 음수 안 되게

    const answer = op === "+" ? a + b : a - b;
    return { a, b, op, answer };
  }

  let currentProblem = null;

  // 곱셈은 반복 덧셈으로 풀이과정을 보여줌 (숫자가 작을 때만, 너무 길어지면 식과 답만 표시)
  function getSolutionSteps({ a, b, op, answer }) {
    if (op === "+") return `${a} + ${b} = ${answer}`;
    if (op === "-") return `${a} - ${b} = ${answer}`;
    if (b <= 9) return `${a} × ${b} = ${Array(b).fill(a).join(" + ")} = ${answer}`;
    return `${a} × ${b} = ${answer}`;
  }

  function showSolution(problem) {
    document.getElementById("solution-content").innerHTML = `
      <h3 style="margin-top:0;">풀이과정</h3>
      <p style="font-size:18px;">${getSolutionSteps(problem)}</p>
      <p style="font-weight:700; font-size:20px; color:var(--accent);">정답: ${problem.answer}</p>
    `;
    document.getElementById("solution-modal").hidden = false;
  }

  document.getElementById("solution-close").addEventListener("click", () => {
    document.getElementById("solution-modal").hidden = true;
  });
  document.getElementById("solution-modal").addEventListener("click", (e) => {
    if (e.target.id === "solution-modal") document.getElementById("solution-modal").hidden = true;
  });

  function renderNumberGame() {
    const container = document.getElementById("products");
    container.style.display = "block";
    currentProblem = generateNumberProblem();
    container.innerHTML = `
      <div class="card" style="width:100%;">
        <h2 style="margin-top:0;">숫자 놀이 🔢 <button type="button" id="number-hint-btn" class="hint-btn">?</button></h2>
        <p class="muted">문제를 계산해서 정답을 입력해보세요!</p>
        <div style="font-size:40px; font-weight:700; text-align:center; margin:20px 0;">${currentProblem.a} ${currentProblem.op} ${currentProblem.b} = ?</div>
        <input id="number-input" type="number" placeholder="정답을 입력하세요" autocomplete="off" style="font-size:20px; text-align:center;">
        <button class="primary" id="number-check-btn" style="width:100%;">확인</button>
        <p class="muted" style="text-align:center;">맞춘 개수: ${numberScore}개</p>
      </div>
    `;

    const input = document.getElementById("number-input");

    function checkAnswer() {
      if (Number(input.value) === currentProblem.answer) {
        numberScore++;
        showCelebration(renderNumberGame);
      } else {
        showWrongAnswerAlert();
      }
    }

    document.getElementById("number-hint-btn").addEventListener("click", () => showSolution(currentProblem));

    document.getElementById("number-check-btn").addEventListener("click", checkAnswer);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") checkAnswer(); });
    input.focus();
  }

  function renderProducts() {
    const category = CATEGORIES.find(c => c.id === activeCategory);
    const container = document.getElementById("products");
    container.style.display = ""; // 한글놀이에서 바꿔둔 display를 grid로 복귀
    container.innerHTML = category.products.map(p => `
      <div class="product-card" data-id="${p.id}">
        <div class="thumb" style="${p.imageUrl ? "" : `background:${p.gradient}`}">${p.imageUrl ? `<img src="${p.imageUrl}" style="width:100%;height:100%;object-fit:cover;">` : PRODUCT_ICON}</div>
        <div class="body">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="price">${p.price.toLocaleString()}원</div>
          <button class="primary" data-id="${p.id}">구매하기</button>
        </div>
      </div>
    `).join("");

    container.querySelectorAll(".product-card").forEach(card => {
      card.addEventListener("click", () => openProductModal(card.dataset.id));
    });
    container.querySelectorAll("button[data-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation(); // 카드 클릭(상세 팝업)으로 안 번지게
        buy(btn.dataset.id);
      });
    });
  }

  // 상품 상세 팝업 + 머문 시간 기록
  let viewingProduct = null;
  let viewStartTime = null;

  // 실제 상품 사진이 준비되면 product.images (URL 6개 배열)를 읽도록 바꾸면 됨.
  // 지금은 사진이 없어서 자리표시용 슬라이드 6장을 만들어 스와이프 구조만 잡아둠.
  const DETAIL_IMAGE_COUNT = 6;
  function getDetailImages(product) {
    if (product.images && product.images.length) return product.images;
    if (product.imageUrl) return [product.imageUrl]; // 상세 사진을 아직 안 올렸으면 대표 사진 1장만 보여줌
    return Array.from({ length: DETAIL_IMAGE_COUNT }, () => product.gradient);
  }

  function renderGallerySlide(bg) {
    if (typeof bg === "string" && /^https?:\/\//.test(bg)) {
      return `<div class="gallery-slide"><img src="${bg}" style="width:100%;height:100%;object-fit:cover;"></div>`;
    }
    return `<div class="gallery-slide" style="background:${bg}">${PRODUCT_ICON}</div>`;
  }

  let galleryImages = [];
  let galleryIndex = 0;

  function updateGallery() {
    document.getElementById("gallery-track").style.transform = `translateX(-${galleryIndex * 100}%)`;
    document.getElementById("gallery-index-badge").textContent = `${galleryIndex + 1}/${galleryImages.length}`;
    document.querySelectorAll("#gallery-dots .dot").forEach((dot, i) => {
      dot.classList.toggle("active", i === galleryIndex);
    });
  }

  function goToSlide(index) {
    galleryIndex = (index + galleryImages.length) % galleryImages.length;
    updateGallery();
  }

  function openProductModal(productId) {
    const product = CATEGORIES.flatMap(c => c.products).find(p => p.id === productId);
    viewingProduct = product;
    viewStartTime = Date.now();
    galleryImages = getDetailImages(product);
    galleryIndex = 0;

    document.getElementById("modal-content").innerHTML = `
      <div class="detail-gallery">
        <div class="gallery-track" id="gallery-track">
          ${galleryImages.map(renderGallerySlide).join("")}
        </div>
        <span class="gallery-index-badge" id="gallery-index-badge"></span>
        <button type="button" class="gallery-arrow gallery-prev">&lsaquo;</button>
        <button type="button" class="gallery-arrow gallery-next">&rsaquo;</button>
        <div class="gallery-dots" id="gallery-dots">
          ${galleryImages.map((_, i) => `<span class="dot"></span>`).join("")}
        </div>
      </div>
      <div class="name">${escapeHtml(product.name)}</div>
      <div class="price">${product.price.toLocaleString()}원</div>
      <button class="primary" id="modal-buy-btn" style="width:100%">구매하기</button>
    `;
    document.getElementById("modal-buy-btn").addEventListener("click", () => {
      closeProductModal();
      buy(product.id);
    });
    document.querySelector(".gallery-prev").addEventListener("click", () => goToSlide(galleryIndex - 1));
    document.querySelector(".gallery-next").addEventListener("click", () => goToSlide(galleryIndex + 1));

    let touchStartX = null;
    const gallery = document.querySelector(".detail-gallery");
    gallery.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
    gallery.addEventListener("touchend", (e) => {
      if (touchStartX === null) return;
      const diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) > 40) goToSlide(diff < 0 ? galleryIndex + 1 : galleryIndex - 1);
      touchStartX = null;
    });

    updateGallery();
    document.getElementById("product-modal").hidden = false;
  }

  async function closeProductModal() {
    if (viewingProduct && viewStartTime) {
      const durationSeconds = Math.round((Date.now() - viewStartTime) / 1000);
      const { data: { user } } = await supabaseClient.auth.getUser();
      await supabaseClient.from("product_views").insert({
        user_id: user ? user.id : null,
        user_email: user ? user.email : null,
        product_id: viewingProduct.id,
        product_name: viewingProduct.name,
        duration_seconds: durationSeconds,
      });
    }
    viewingProduct = null;
    viewStartTime = null;
    document.getElementById("product-modal").hidden = true;
  }

  document.getElementById("modal-close").addEventListener("click", closeProductModal);
  document.getElementById("product-modal").addEventListener("click", (e) => {
    if (e.target.id === "product-modal") closeProductModal(); // 배경 클릭 시 닫기
  });

  async function buy(productId) {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      alert("로그인이 필요합니다.");
      location.href = "login.html";
      return;
    }

    const product = CATEGORIES.flatMap(c => c.products).find(p => p.id === productId);
    const orderId = `order_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    // 결제 승인 단계(success.html)에서 필요하니 잠깐 저장해둔다
    sessionStorage.setItem("pendingProductName", product.name);

    const tossPayments = TossPayments(TOSS_CLIENT_KEY);
    tossPayments.requestPayment("카드", {
      amount: product.price,
      orderId,
      orderName: product.name,
      successUrl: new URL("success.html", location.href).href,
      failUrl: new URL("fail.html", location.href).href,
    });
  }

  // 관리자가 상품추가 탭에서 등록/수정/삭제한 상품을 카테고리별로 불러옴
  async function loadDbProducts() {
    const { data, error } = await supabaseClient.from("products").select("*");
    if (error || !data) return;
    data.forEach(row => {
      const category = CATEGORIES.find(c => c.id === row.category_id);
      if (!category) return;
      category.products.push({
        id: row.id,
        name: row.name,
        price: row.price,
        imageUrl: row.image_url,
        gradient: row.gradient,
        images: row.detail_image_urls,
      });
    });
  }

  // CATEGORIES가 menus 테이블에서 채워져야 상품을 카테고리별로 연결할 수 있어서, 메뉴부터 불러온 뒤 상품을 불러옴
  loadMenus().then(() => {
    activeCategory = (allMenuItems.find(m => m.visible) || {}).id || null;
    renderCategoryList();
    return Promise.all([loadDbProducts(), loadNewsLinks()]);
  }).then(() => {
    renderMainContent();
  });

  // 알림 받기(동의) 버튼: 한 번 눌러서 결정하고 나면(허용/거부 상관없이) 다시 안 보이게 함
  // ("홈 화면에 추가" 배너와 동일한 1회성 노출 패턴)
  (async function setupPushSubscribeCard() {
    if (typeof isPushSupported !== "function" || !isPushSupported()) return;

    const { data: { user } } = await supabaseClient.auth.getUser();
    // 계정별로 "이미 결정했음" 여부를 따로 기억해야, 같은 기기에서 다른 아이디로 로그인해도
    // 그 계정에게 다시 물어볼 수 있음 (기기 단위가 아니라 로그인 계정 단위로 판단).
    const DISMISSED_KEY = "pushSubscribeCardDismissed_" + (user ? user.id : "anon");
    let dismissed = false;
    try {
      dismissed = localStorage.getItem(DISMISSED_KEY) === "1";
    } catch (_) { /* 프라이빗 모드 등에서 localStorage가 막혀있으면 그냥 매번 안 띄움 */ }
    if (dismissed) return;

    const reg = await navigator.serviceWorker.ready;
    const existingSub = await reg.pushManager.getSubscription();

    if (existingSub) {
      if (!user) return; // 비로그인 상태는 기존처럼 기기 단위 구독 여부만 봄
      // 이 기기가 이미 구독 중이어도, 다른 계정이 먼저 구독했을 수 있으므로
      // "이 계정"으로 등록된 행이 있는지 DB에서 따로 확인함
      const { data: myRow } = await supabaseClient
        .from("push_subscriptions")
        .select("id")
        .eq("endpoint", existingSub.endpoint)
        .eq("user_id", user.id)
        .maybeSingle();
      if (myRow) {
        try { localStorage.setItem(DISMISSED_KEY, "1"); } catch (_) {}
        return;
      }
    }

    document.getElementById("push-subscribe-card").hidden = false;
    document.getElementById("push-subscribe-btn").addEventListener("click", async () => {
      const statusEl = document.getElementById("push-subscribe-status");
      try {
        const sub = await subscribeToPush();
        statusEl.textContent = sub ? "알림을 받도록 설정했어요!" : "알림 권한이 거부되었습니다.";
      } catch (err) {
        statusEl.textContent = "설정 실패: " + err.message;
      }
      try { localStorage.setItem(DISMISSED_KEY, "1"); } catch (_) {}
      setTimeout(() => { document.getElementById("push-subscribe-card").hidden = true; }, 1500);
    });
  })();
</script>
