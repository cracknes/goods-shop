<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>지후네 하우스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap wrap-wide">
  <div class="hero">
    <h1>지후네 하우스</h1>
    <p>우리 가족 항상 행복하길 지후야 사랑해</p>
  </div>
  <p class="muted">토스페이먼츠 테스트 모드로 결제됩니다. 실제로 돈이 나가지 않으니, 결제창에는 아무 번호가 아니라 실제 본인 카드 정보를 입력해 주세요.</p>

  <div class="card" id="push-subscribe-card" hidden>
    <h2 style="margin-top:0;">알림 받기 🔔</h2>
    <p class="muted">새로운 소식을 알림으로 받아보세요.</p>
    <button class="primary" id="push-subscribe-btn" style="width:100%;">알림 받기</button>
    <p id="push-subscribe-status" class="muted"></p>
  </div>

  <div class="shop-layout">
    <div id="category-list" class="category-list"></div>
    <div class="shop-content">
      <div id="products" class="product-grid"></div>
    </div>
  </div>
</div>

<div id="product-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <button type="button" id="modal-close" class="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<div id="celebrate-modal" class="modal-overlay" hidden>
  <div class="modal-box celebrate-box">
    <div class="celebrate-emoji">🎉❤️</div>
    <div class="celebrate-text">지후야 참 잘했어!</div>
  </div>
</div>

<div id="wrong-modal" class="modal-overlay" hidden>
  <div class="modal-box celebrate-box">
    <div class="celebrate-emoji">😢</div>
    <div class="celebrate-text">지후야 다시생각해봐</div>
  </div>
</div>

<div id="solution-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <button type="button" id="solution-close" class="modal-close">&times;</button>
    <div id="solution-content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://js.tosspayments.com/v1/payment"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="pwa.js"></script>
<script>
  const TOSS_CLIENT_KEY = "test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq"; // 토스 공용 샘플 테스트 클라이언트키

  // 상품 카테고리 목록은 Supabase의 menus 테이블(type='category')에서 불러옴 — 관리자페이지
  // "메뉴관리" 탭에서 자유롭게 추가/삭제/노출설정 가능. loadMenus()가 채워줌.
  // 상품 데이터 자체는 products 테이블에서 불러옴 (관리자페이지 "상품관리" 탭에서 추가/수정/삭제).
  let CATEGORIES = [];

  // 이모지는 기기/폰트마다 렌더링 크기가 달라서 SVG 아이콘 하나로 통일 (모든 기기에서 100% 동일한 크기)
  const PRODUCT_ICON = `
    <svg viewBox="0 0 24 24" fill="none" stroke="rgba(10,18,41,0.55)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.59 13.41 13 21a2 2 0 0 1-2.83 0L2 12.83V4a2 2 0 0 1 2-2h8.83a2 2 0 0 1 1.41.59l7.35 7.35a2 2 0 0 1 0 2.83Z"></path>
      <circle cx="7.5" cy="7.5" r="1.5"></circle>
    </svg>
  `;

  // 신문사 로고 대신 쓰는 공용 아이콘 (실제 로고 이미지를 못 가져와서, 상품 아이콘과 동일한 방식으로 통일감 있게 표현)
  const NEWS_ICON = `
    <svg viewBox="0 0 24 24" fill="none" stroke="rgba(10,18,41,0.55)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
      <line x1="7" y1="8" x2="17" y2="8"></line>
      <line x1="7" y1="12" x2="17" y2="12"></line>
      <line x1="7" y1="16" x2="13" y2="16"></line>
    </svg>
  `;

  let activeCategory = null;

  // 좌측 메뉴 전체(상품 카테고리 + 한글놀이/숫자놀이/오늘의뉴스)를 menus 테이블에서 불러옴.
  // 관리자페이지 "메뉴관리" 탭에서 노출 여부를 켜고 끄거나, 상품 카테고리는 추가/삭제도 할 수 있음.
  let allMenuItems = [];

  async function loadMenus() {
    const { data, error } = await supabaseClient.from("menus").select("*").order("sort_order");
    if (error || !data) return;
    allMenuItems = data;
    CATEGORIES = data.filter(m => m.type === "category").map(m => ({ id: m.id, name: m.name, products: [] }));
  }

  function renderCategoryList() {
    const list = document.getElementById("category-list");
    const items = allMenuItems.filter(m => m.visible);

    list.innerHTML = items.map(item => `
      <button data-cat="${item.id}" class="${item.id === activeCategory ? "active" : ""}">${escapeHtml(item.name)}</button>
    `).join("");

    list.querySelectorAll("button[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        renderCategoryList();
        renderMainContent();
      });
    });
  }

  function renderMainContent() {
    if (!activeCategory) {
      document.getElementById("products").style.display = "block";
      document.getElementById("products").innerHTML = `<div class="card" style="width:100%;"><p class="muted">표시할 메뉴가 없습니다.</p></div>`;
      return;
    }
    if (activeCategory === "game") {
      renderHangulGame();
      return;
    }
    if (activeCategory === "numbergame") {
      renderNumberGame();
      return;
    }
    if (activeCategory === "news") {
      renderNewsMenu();
      return;
    }
    renderProducts();
  }

  // 오늘의뉴스: 신문사별 지면보기 + 한국거래소 시세정보 + DART 전자공시 바로가기
  // 네이버 지면보기 3곳은 새 창으로 열면 일부 모바일 브라우저/앱에서 데스크탑 모드로 열리는 경우가 있어
  // 같은 탭에서 이동하도록(sameTab) 함 — 새 탭으로 열 때보다 모바일 화면으로 뜰 확률이 높음.
  const NEWSPAPERS = [
    { name: "한국경제", url: "https://media.naver.com/press/015/newspaper", gradient: "linear-gradient(135deg, #cfe0ff, #9db8f5)", sameTab: true },
    { name: "매일경제", url: "https://media.naver.com/press/009/newspaper", gradient: "linear-gradient(135deg, #ffe3c2, #ffbf7a)", sameTab: true },
    { name: "코리아중앙데일리", url: "https://media.naver.com/press/640/newspaper", gradient: "linear-gradient(135deg, #d7f0e6, #a3ddc4)", sameTab: true },
    { name: "한국거래소(KRX) 시세정보", url: "https://data.krx.co.kr/contents/MDC/MDI/mdiLoader/index.cmd?menuId=MDC0201020303", gradient: "linear-gradient(135deg, #e6e9f0, #c3cbe0)" },
    { name: "DART 전자공시", url: "https://dart.fss.or.kr/dsab007/main.do", gradient: "linear-gradient(135deg, #ffe0ec, #ffb3cf)" },
    { name: "Npay 증권", url: "https://stock.naver.com/domestic/stock/000270/price", gradient: "linear-gradient(135deg, #fff3c4, #ffd980)", sameTab: true },
  ];

  function renderNewsMenu() {
    const container = document.getElementById("products");
    container.style.display = ""; // 상품 그리드와 동일한 카드 그리드 레이아웃 사용
    container.innerHTML = NEWSPAPERS.map(n => `
      <a class="product-card" href="${n.url}" ${n.sameTab ? "" : `target="_blank" rel="noopener"`} style="text-decoration:none; color:inherit;">
        <div class="thumb" style="background:${n.gradient}">${NEWS_ICON}</div>
        <div class="body">
          <div class="name">${escapeHtml(n.name)}</div>
          <div class="price">지면보기 바로가기</div>
        </div>
      </a>
    `).join("");
  }

  function showWrongAnswerAlert() {
    document.getElementById("wrong-modal").hidden = false;
    setTimeout(() => {
      document.getElementById("wrong-modal").hidden = true;
    }, 1300);
  }

  function showCelebration(next) {
    document.getElementById("celebrate-modal").hidden = false;
    setTimeout(() => {
      document.getElementById("celebrate-modal").hidden = true;
      next();
    }, 1300);
  }

  // 아이용 한글 놀이: 화면에 뜬 단어를 실제 키보드(한글 IME)로 그대로 입력해서 맞히기
  const HANGUL_WORDS = ["사과", "바나나", "나비", "우유", "고양이", "강아지", "학교", "나무", "하늘", "바다"];
  let gameIndex = 0;
  let gameScore = 0;

  function renderHangulGame() {
    const container = document.getElementById("products");
    container.style.display = "block"; // 상품 그리드(여러 칸) 대신 한 칸을 꽉 채우게
    const word = HANGUL_WORDS[gameIndex % HANGUL_WORDS.length];
    container.innerHTML = `
      <div class="card" style="width:100%;">
        <h2 style="margin-top:0;">한글 놀이 🎈</h2>
        <p class="muted">아래 글자를 똑같이 따라 입력해보세요!</p>
        <div style="font-size:40px; font-weight:700; text-align:center; margin:20px 0;">${word}</div>
        <input id="game-input" type="text" placeholder="여기에 입력하세요" autocomplete="off" style="font-size:20px; text-align:center;">
        <button class="primary" id="game-check-btn" style="width:100%;">확인</button>
        <p class="muted" style="text-align:center;">맞춘 개수: ${gameScore}개</p>
      </div>
    `;

    const input = document.getElementById("game-input");

    function checkAnswer() {
      if (input.value.trim() === word) {
        gameScore++;
        gameIndex++;
        showCelebration(renderHangulGame);
      } else {
        showWrongAnswerAlert();
      }
    }

    document.getElementById("game-check-btn").addEventListener("click", checkAnswer);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") checkAnswer(); });
    input.focus();
  }

  // 아이용 숫자 놀이: 덧셈/뺄셈은 한 자리(1~9)와 두 자리(10~99) 숫자를 섞어서 출제
  // 곱셈은 한 자리끼리가 기본이고, 11×11~19×19 같은 동일 두 자리 제곱만 예외로 허용
  let numberScore = 0;

  function generateNumberProblem() {
    const op = ["+", "-", "×"][Math.floor(Math.random() * 3)];

    if (op === "×") {
      if (Math.random() < 0.5) {
        const n = Math.floor(Math.random() * 9) + 11; // 11~19
        return { a: n, b: n, op, answer: n * n };
      }
      const a = Math.floor(Math.random() * 9) + 1;
      const b = Math.floor(Math.random() * 9) + 1;
      return { a, b, op, answer: a * b };
    }

    // 항상 한 자리 하나 + 두 자리 하나로 조합 (둘 다 두 자리가 되지 않게)
    const oneDigit = Math.floor(Math.random() * 9) + 1; // 1~9
    const twoDigit = Math.floor(Math.random() * 90) + 10; // 10~99
    let a = Math.random() < 0.5 ? oneDigit : twoDigit;
    let b = a === oneDigit ? twoDigit : oneDigit;
    if (op === "-" && a < b) [a, b] = [b, a]; // 결과가 음수 안 되게

    const answer = op === "+" ? a + b : a - b;
    return { a, b, op, answer };
  }

  let currentProblem = null;

  // 곱셈은 반복 덧셈으로 풀이과정을 보여줌 (숫자가 작을 때만, 너무 길어지면 식과 답만 표시)
  function getSolutionSteps({ a, b, op, answer }) {
    if (op === "+") return `${a} + ${b} = ${answer}`;
    if (op === "-") return `${a} - ${b} = ${answer}`;
    if (b <= 9) return `${a} × ${b} = ${Array(b).fill(a).join(" + ")} = ${answer}`;
    return `${a} × ${b} = ${answer}`;
  }

  function showSolution(problem) {
    document.getElementById("solution-content").innerHTML = `
      <h3 style="margin-top:0;">풀이과정</h3>
      <p style="font-size:18px;">${getSolutionSteps(problem)}</p>
      <p style="font-weight:700; font-size:20px; color:var(--accent);">정답: ${problem.answer}</p>
    `;
    document.getElementById("solution-modal").hidden = false;
  }

  document.getElementById("solution-close").addEventListener("click", () => {
    document.getElementById("solution-modal").hidden = true;
  });
  document.getElementById("solution-modal").addEventListener("click", (e) => {
    if (e.target.id === "solution-modal") document.getElementById("solution-modal").hidden = true;
  });

  function renderNumberGame() {
    const container = document.getElementById("products");
    container.style.display = "block";
    currentProblem = generateNumberProblem();
    container.innerHTML = `
      <div class="card" style="width:100%;">
        <h2 style="margin-top:0;">숫자 놀이 🔢 <button type="button" id="number-hint-btn" class="hint-btn">?</button></h2>
        <p class="muted">문제를 계산해서 정답을 입력해보세요!</p>
        <div style="font-size:40px; font-weight:700; text-align:center; margin:20px 0;">${currentProblem.a} ${currentProblem.op} ${currentProblem.b} = ?</div>
        <input id="number-input" type="number" placeholder="정답을 입력하세요" autocomplete="off" style="font-size:20px; text-align:center;">
        <button class="primary" id="number-check-btn" style="width:100%;">확인</button>
        <p class="muted" style="text-align:center;">맞춘 개수: ${numberScore}개</p>
      </div>
    `;

    const input = document.getElementById("number-input");

    function checkAnswer() {
      if (Number(input.value) === currentProblem.answer) {
        numberScore++;
        showCelebration(renderNumberGame);
      } else {
        showWrongAnswerAlert();
      }
    }

    document.getElementById("number-hint-btn").addEventListener("click", () => showSolution(currentProblem));

    document.getElementById("number-check-btn").addEventListener("click", checkAnswer);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") checkAnswer(); });
    input.focus();
  }

  function renderProducts() {
    const category = CATEGORIES.find(c => c.id === activeCategory);
    const container = document.getElementById("products");
    container.style.display = ""; // 한글놀이에서 바꿔둔 display를 grid로 복귀
    container.innerHTML = category.products.map(p => `
      <div class="product-card" data-id="${p.id}">
        <div class="thumb" style="${p.imageUrl ? "" : `background:${p.gradient}`}">${p.imageUrl ? `<img src="${p.imageUrl}" style="width:100%;height:100%;object-fit:cover;">` : PRODUCT_ICON}</div>
        <div class="body">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="price">${p.price.toLocaleString()}원</div>
          <button class="primary" data-id="${p.id}">구매하기</button>
        </div>
      </div>
    `).join("");

    container.querySelectorAll(".product-card").forEach(card => {
      card.addEventListener("click", () => openProductModal(card.dataset.id));
    });
    container.querySelectorAll("button[data-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation(); // 카드 클릭(상세 팝업)으로 안 번지게
        buy(btn.dataset.id);
      });
    });
  }

  // 상품 상세 팝업 + 머문 시간 기록
  let viewingProduct = null;
  let viewStartTime = null;

  // 실제 상품 사진이 준비되면 product.images (URL 6개 배열)를 읽도록 바꾸면 됨.
  // 지금은 사진이 없어서 자리표시용 슬라이드 6장을 만들어 스와이프 구조만 잡아둠.
  const DETAIL_IMAGE_COUNT = 6;
  function getDetailImages(product) {
    if (product.images && product.images.length) return product.images;
    if (product.imageUrl) return [product.imageUrl]; // 상세 사진을 아직 안 올렸으면 대표 사진 1장만 보여줌
    return Array.from({ length: DETAIL_IMAGE_COUNT }, () => product.gradient);
  }

  function renderGallerySlide(bg) {
    if (typeof bg === "string" && /^https?:\/\//.test(bg)) {
      return `<div class="gallery-slide"><img src="${bg}" style="width:100%;height:100%;object-fit:cover;"></div>`;
    }
    return `<div class="gallery-slide" style="background:${bg}">${PRODUCT_ICON}</div>`;
  }

  let galleryImages = [];
  let galleryIndex = 0;

  function updateGallery() {
    document.getElementById("gallery-track").style.transform = `translateX(-${galleryIndex * 100}%)`;
    document.getElementById("gallery-index-badge").textContent = `${galleryIndex + 1}/${galleryImages.length}`;
    document.querySelectorAll("#gallery-dots .dot").forEach((dot, i) => {
      dot.classList.toggle("active", i === galleryIndex);
    });
  }

  function goToSlide(index) {
    galleryIndex = (index + galleryImages.length) % galleryImages.length;
    updateGallery();
  }

  function openProductModal(productId) {
    const product = CATEGORIES.flatMap(c => c.products).find(p => p.id === productId);
    viewingProduct = product;
    viewStartTime = Date.now();
    galleryImages = getDetailImages(product);
    galleryIndex = 0;

    document.getElementById("modal-content").innerHTML = `
      <div class="detail-gallery">
        <div class="gallery-track" id="gallery-track">
          ${galleryImages.map(renderGallerySlide).join("")}
        </div>
        <span class="gallery-index-badge" id="gallery-index-badge"></span>
        <button type="button" class="gallery-arrow gallery-prev">&lsaquo;</button>
        <button type="button" class="gallery-arrow gallery-next">&rsaquo;</button>
        <div class="gallery-dots" id="gallery-dots">
          ${galleryImages.map((_, i) => `<span class="dot"></span>`).join("")}
        </div>
      </div>
      <div class="name">${escapeHtml(product.name)}</div>
      <div class="price">${product.price.toLocaleString()}원</div>
      <button class="primary" id="modal-buy-btn" style="width:100%">구매하기</button>
    `;
    document.getElementById("modal-buy-btn").addEventListener("click", () => {
      closeProductModal();
      buy(product.id);
    });
    document.querySelector(".gallery-prev").addEventListener("click", () => goToSlide(galleryIndex - 1));
    document.querySelector(".gallery-next").addEventListener("click", () => goToSlide(galleryIndex + 1));

    let touchStartX = null;
    const gallery = document.querySelector(".detail-gallery");
    gallery.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
    gallery.addEventListener("touchend", (e) => {
      if (touchStartX === null) return;
      const diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) > 40) goToSlide(diff < 0 ? galleryIndex + 1 : galleryIndex - 1);
      touchStartX = null;
    });

    updateGallery();
    document.getElementById("product-modal").hidden = false;
  }

  async function closeProductModal() {
    if (viewingProduct && viewStartTime) {
      const durationSeconds = Math.round((Date.now() - viewStartTime) / 1000);
      const { data: { user } } = await supabaseClient.auth.getUser();
      await supabaseClient.from("product_views").insert({
        user_id: user ? user.id : null,
        user_email: user ? user.email : null,
        product_id: viewingProduct.id,
        product_name: viewingProduct.name,
        duration_seconds: durationSeconds,
      });
    }
    viewingProduct = null;
    viewStartTime = null;
    document.getElementById("product-modal").hidden = true;
  }

  document.getElementById("modal-close").addEventListener("click", closeProductModal);
  document.getElementById("product-modal").addEventListener("click", (e) => {
    if (e.target.id === "product-modal") closeProductModal(); // 배경 클릭 시 닫기
  });

  async function buy(productId) {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      alert("로그인이 필요합니다.");
      location.href = "login.html";
      return;
    }

    const product = CATEGORIES.flatMap(c => c.products).find(p => p.id === productId);
    const orderId = `order_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    // 결제 승인 단계(success.html)에서 필요하니 잠깐 저장해둔다
    sessionStorage.setItem("pendingProductName", product.name);

    const tossPayments = TossPayments(TOSS_CLIENT_KEY);
    tossPayments.requestPayment("카드", {
      amount: product.price,
      orderId,
      orderName: product.name,
      successUrl: new URL("success.html", location.href).href,
      failUrl: new URL("fail.html", location.href).href,
    });
  }

  // 관리자가 상품추가 탭에서 등록/수정/삭제한 상품을 카테고리별로 불러옴
  async function loadDbProducts() {
    const { data, error } = await supabaseClient.from("products").select("*");
    if (error || !data) return;
    data.forEach(row => {
      const category = CATEGORIES.find(c => c.id === row.category_id);
      if (!category) return;
      category.products.push({
        id: row.id,
        name: row.name,
        price: row.price,
        imageUrl: row.image_url,
        gradient: row.gradient,
        images: row.detail_image_urls,
      });
    });
  }

  // CATEGORIES가 menus 테이블에서 채워져야 상품을 카테고리별로 연결할 수 있어서, 메뉴부터 불러온 뒤 상품을 불러옴
  loadMenus().then(() => {
    activeCategory = (allMenuItems.find(m => m.visible) || {}).id || null;
    renderCategoryList();
    return loadDbProducts();
  }).then(() => {
    renderMainContent();
  });

  // 알림 받기(동의) 버튼: 한 번 눌러서 결정하고 나면(허용/거부 상관없이) 다시 안 보이게 함
  // ("홈 화면에 추가" 배너와 동일한 1회성 노출 패턴)
  (async function setupPushSubscribeCard() {
    if (typeof isPushSupported !== "function" || !isPushSupported()) return;

    const DISMISSED_KEY = "pushSubscribeCardDismissed";
    let dismissed = false;
    try {
      dismissed = localStorage.getItem(DISMISSED_KEY) === "1";
    } catch (_) { /* 프라이빗 모드 등에서 localStorage가 막혀있으면 그냥 매번 안 띄움 */ }
    if (dismissed) return;

    const reg = await navigator.serviceWorker.ready;
    const existingSub = await reg.pushManager.getSubscription();
    if (existingSub) return; // 이미 구독한 브라우저면 보여줄 필요 없음

    document.getElementById("push-subscribe-card").hidden = false;
    document.getElementById("push-subscribe-btn").addEventListener("click", async () => {
      const statusEl = document.getElementById("push-subscribe-status");
      try {
        const sub = await subscribeToPush();
        statusEl.textContent = sub ? "알림을 받도록 설정했어요!" : "알림 권한이 거부되었습니다.";
      } catch (err) {
        statusEl.textContent = "설정 실패: " + err.message;
      }
      try { localStorage.setItem(DISMISSED_KEY, "1"); } catch (_) {}
      setTimeout(() => { document.getElementById("push-subscribe-card").hidden = true; }, 1500);
    });
  })();
</script>
</body>
</html>
