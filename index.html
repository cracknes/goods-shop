<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>굿즈샵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="wrap">
  <h1>굿즈 목록</h1>
  <p class="muted">토스페이먼츠 테스트 모드로 결제됩니다. 실제로 돈이 나가지 않아요.</p>
  <div id="products"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://js.tosspayments.com/v1/payment"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script>
  const TOSS_CLIENT_KEY = "test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq"; // 토스 공용 샘플 테스트 클라이언트키

  const PRODUCTS = [
    { id: "sticker", name: "굿즈 스티커팩", price: 5000, image: "" },
    { id: "ecobag", name: "굿즈 에코백", price: 15000, image: "" },
    { id: "mug", name: "굿즈 머그컵", price: 12000, image: "" },
  ];

  function renderProducts() {
    const container = document.getElementById("products");
    container.innerHTML = PRODUCTS.map(p => `
      <div class="card product">
        <div class="info">
          <div>${p.name}</div>
          <div class="price">${p.price.toLocaleString()}원</div>
        </div>
        <button class="primary" data-id="${p.id}">구매하기</button>
      </div>
    `).join("");

    container.querySelectorAll("button[data-id]").forEach(btn => {
      btn.addEventListener("click", () => buy(btn.dataset.id));
    });
  }

  async function buy(productId) {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      alert("로그인이 필요합니다.");
      location.href = "login.html";
      return;
    }

    const product = PRODUCTS.find(p => p.id === productId);
    const orderId = `order_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    // 결제 승인 단계(success.html)에서 필요하니 잠깐 저장해둔다
    sessionStorage.setItem("pendingProductName", product.name);

    const tossPayments = TossPayments(TOSS_CLIENT_KEY);
    tossPayments.requestPayment("카드", {
      amount: product.price,
      orderId,
      orderName: product.name,
      successUrl: new URL("success.html", location.href).href,
      failUrl: new URL("fail.html", location.href).href,
    });
  }

  renderProducts();
</script>
</body>
</html>
