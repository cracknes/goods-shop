<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 일부러 기기 폭이 아니라 고정된 가상 화면 폭으로 선언함 — DART 전자공시 같은 구형 페이지는
     반응형이 아니고 자체적으로 확대/축소도 막아놔서(maximum-scale=1.0), 우리 쪽 래퍼 페이지에서
     실제 본문 폭에 맞는 뷰포트를 선언해 모바일 브라우저가 자동으로 전체를 축소해서 보여주게 함
     (이후 사용자가 직접 확대하는 건 자유로움 — 래퍼 페이지엔 그런 제한이 없으므로).
     635px: DART 공시 본문(#divReportBody)이 실제로 630px 고정폭이라(view-report-invest.css에서
     직접 확인함) 딱 그 폭 + 최소한의 여유만 둔 값 — 처음엔 1280으로 뒀다가 너무 작게 축소돼서
     700으로 줄였는데, 그래도 본문(630px)보다 넓어서 오른쪽에 빈 공백이 보였음(실제 본문 폭에
     최대한 가깝게 맞춰야 공백이 없음). -->
<meta name="viewport" content="width=635">
<title>외부 페이지 보기</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow-x: hidden; }
  /* iframe을 고정 700px로 두면(이전 버전) 뷰포트 meta가 안 먹히는 환경(데스크톱 브라우저는
     모바일 전용인 이 meta 태그를 아예 무시함)에서 그 700px 그대로 가로 스크롤이 생겼음 —
     100%로 바꿔서 실제 화면 폭에 맞춤(모바일에서는 위 meta가 적용돼 선언한 700px 가상
     화면의 100%가 되고, 데스크톱에서는 meta가 무시되니 그냥 실제 창 폭의 100%가 됨). */
  iframe { display: block; width: 100%; height: 100vh; border: none; }
  #denied { font-family: sans-serif; padding: 24px; }
</style>
</head>
<body>
<div id="denied" hidden>허용되지 않은 주소입니다.</div>
<script>
  // 이 페이지는 로그인 없이 누구나 열 수 있는 정적 파일이라(GitHub Pages),
  // 아무 주소나 iframe으로 띄우는 통로가 되지 않도록 허용된 도메인만 받음.
  const ALLOWED_HOSTS = ["dart.fss.or.kr"];
  const params = new URLSearchParams(location.search);
  const target = params.get("url");
  let valid = false;
  try {
    const u = new URL(target);
    valid = u.protocol === "https:" && ALLOWED_HOSTS.includes(u.hostname);
  } catch (_) {}

  if (valid) {
    const iframe = document.createElement("iframe");
    iframe.src = target;
    document.body.appendChild(iframe);
  } else {
    document.getElementById("denied").hidden = false;
  }
</script>
</body>
</html>
