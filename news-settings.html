<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6b9080">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오늘의 뉴스 관리 | 지후네 하우스</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/static/split/WantedSans.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<nav id="bottom-nav" class="bottom-nav"></nav>
<div class="wrap">
  <div class="card">
    <p class="muted">메인 화면 "오늘의 뉴스" 메뉴에 나한테만 보여줄 바로가기 카드 목록이에요. 꺼두면 메인 화면에서 바로 숨겨져요.</p>
    <div id="newslinks-list-view">
      <button type="button" class="primary" id="newslinks-new-btn" style="width:100%; margin-bottom:12px;">+ 새 바로가기 추가</button>
      <div id="newslinks-list"></div>
      <p id="newslinks-empty" class="muted" hidden>등록된 바로가기가 없습니다.</p>
    </div>
    <div id="newslinks-detail-view" hidden>
      <button type="button" id="newslinks-back-btn" class="muted" style="background:none; border:none; cursor:pointer; padding:0; margin-bottom:12px;">&larr; 목록으로</button>
      <h3 id="newslinks-form-title" style="margin-top:0;">바로가기 추가</h3>
      <label class="form-section-label" for="newslinks-name" style="margin-top:0;">이름</label>
      <input id="newslinks-name" type="text" placeholder="예: 한국경제">
      <label class="form-section-label" for="newslinks-url">링크 주소</label>
      <input id="newslinks-url" type="text" placeholder="https://...">
      <label style="display:flex; align-items:center; gap:8px; margin:4px 0 12px; cursor:pointer;">
        <input type="checkbox" id="newslinks-sametab" style="width:18px; height:18px;">
        <span>같은 탭에서 열기 (체크 안 하면 새 탭으로 열림 — 새 탭에서 이상하게 열리는 사이트만 체크)</span>
      </label>
      <label class="form-section-label" style="margin-top:0;">카드 배경색</label>
      <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <span class="muted" style="font-size:13px;">시작색</span>
          <input id="newslinks-color1" type="color" value="#cfe0ff" style="width:44px; height:36px; padding:2px; margin:0;">
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <span class="muted" style="font-size:13px;">끝색</span>
          <input id="newslinks-color2" type="color" value="#9db8f5" style="width:44px; height:36px; padding:2px; margin:0;">
        </label>
        <div id="newslinks-preview" style="flex:1; height:36px; border-radius:10px;"></div>
      </div>
      <button class="primary" id="newslinks-submit" style="width:100%; margin-top:8px;">저장</button>
      <button type="button" class="danger-btn" id="newslinks-delete-btn" hidden style="width:100%; margin-top:8px;">삭제</button>
      <p id="newslinks-status" class="muted"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="bottom-nav.js"></script>
<script src="pwa.js"></script>
<script>
  let allNewsLinks = [];
  let editingNewsLinkId = null;

  function buildGradient(c1, c2) {
    return `linear-gradient(135deg, ${c1}, ${c2})`;
  }

  function parseGradientColors(gradient) {
    const m = (gradient || "").match(/#[0-9a-fA-F]{6}/g);
    return m && m.length >= 2 ? [m[0], m[1]] : ["#cfe0ff", "#9db8f5"];
  }

  function updateNewsLinkPreview() {
    const c1 = document.getElementById("newslinks-color1").value;
    const c2 = document.getElementById("newslinks-color2").value;
    document.getElementById("newslinks-preview").style.background = buildGradient(c1, c2);
  }
  document.getElementById("newslinks-color1").addEventListener("input", updateNewsLinkPreview);
  document.getElementById("newslinks-color2").addEventListener("input", updateNewsLinkPreview);

  function showNewsLinksList() {
    document.getElementById("newslinks-list-view").hidden = false;
    document.getElementById("newslinks-detail-view").hidden = true;
  }

  function showNewsLinkForm(link) {
    editingNewsLinkId = link ? link.id : null;
    document.getElementById("newslinks-form-title").textContent = link ? "바로가기 수정" : "바로가기 추가";
    document.getElementById("newslinks-name").value = link ? link.name : "";
    document.getElementById("newslinks-url").value = link ? link.url : "";
    document.getElementById("newslinks-sametab").checked = link ? link.same_tab : false;
    const [c1, c2] = parseGradientColors(link ? link.gradient : null);
    document.getElementById("newslinks-color1").value = c1;
    document.getElementById("newslinks-color2").value = c2;
    updateNewsLinkPreview();
    document.getElementById("newslinks-delete-btn").hidden = !link;
    document.getElementById("newslinks-status").textContent = "";
    document.getElementById("newslinks-list-view").hidden = true;
    document.getElementById("newslinks-detail-view").hidden = false;
  }

  document.getElementById("newslinks-new-btn").addEventListener("click", () => showNewsLinkForm(null));
  document.getElementById("newslinks-back-btn").addEventListener("click", showNewsLinksList);

  function renderNewsLinksList() {
    document.getElementById("newslinks-empty").hidden = allNewsLinks.length > 0;
    document.getElementById("newslinks-list").innerHTML = allNewsLinks.map((n, i) => `
      <div class="inquiry-row" data-id="${n.id}">
        <div style="display:flex; align-items:center; gap:10px; cursor:pointer; min-width:0; flex:1;" data-edit="${n.id}">
          <div style="display:flex; flex-direction:column; gap:2px; flex-shrink:0;">
            <button type="button" class="reorder-btn newslink-up-btn" data-id="${n.id}" ${i === 0 ? "disabled" : ""} aria-label="위로">&uarr;</button>
            <button type="button" class="reorder-btn newslink-down-btn" data-id="${n.id}" ${i === allNewsLinks.length - 1 ? "disabled" : ""} aria-label="아래로">&darr;</button>
          </div>
          <div style="width:32px; height:32px; border-radius:8px; background:${n.gradient}; flex-shrink:0;"></div>
          <div style="min-width:0;">
            <div>${escapeHtml(n.name)}</div>
            <div class="inquiry-meta" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(n.url)}</div>
          </div>
        </div>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; flex-shrink:0;">
          <input type="checkbox" class="newslink-visible-toggle" data-id="${n.id}" style="width:18px; height:18px;" ${n.visible ? "checked" : ""}>
          <span class="muted">노출</span>
        </label>
        <button type="button" class="danger-btn newslink-delete-btn" data-id="${n.id}" style="width:auto; padding:6px 10px; font-size:12px; flex-shrink:0;">삭제</button>
      </div>
    `).join("");

    document.querySelectorAll("[data-edit]").forEach(el => {
      el.addEventListener("click", () => showNewsLinkForm(allNewsLinks.find(n => n.id === el.dataset.edit)));
    });
    document.querySelectorAll(".newslink-visible-toggle").forEach(cb => {
      cb.addEventListener("change", async () => {
        const { error } = await supabaseClient.from("user_news_links").update({ visible: cb.checked }).eq("id", cb.dataset.id);
        if (error) {
          alert("변경 실패: " + error.message);
          cb.checked = !cb.checked;
          return;
        }
        const link = allNewsLinks.find(n => n.id === cb.dataset.id);
        if (link) link.visible = cb.checked;
      });
    });
    document.querySelectorAll(".newslink-up-btn").forEach(btn => {
      btn.addEventListener("click", () => moveNewsLink(btn.dataset.id, "up"));
    });
    document.querySelectorAll(".newslink-down-btn").forEach(btn => {
      btn.addEventListener("click", () => moveNewsLink(btn.dataset.id, "down"));
    });
    document.querySelectorAll(".newslink-delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("정말 삭제하시겠어요?")) return;
        const { error } = await supabaseClient.from("user_news_links").delete().eq("id", btn.dataset.id);
        if (error) {
          alert("삭제 실패: " + error.message);
          return;
        }
        await loadNewsLinks();
      });
    });
  }

  async function moveNewsLink(id, direction) {
    const index = allNewsLinks.findIndex(n => n.id === id);
    const targetIndex = direction === "up" ? index - 1 : index + 1;
    if (index === -1 || targetIndex < 0 || targetIndex >= allNewsLinks.length) return;

    const current = allNewsLinks[index];
    const target = allNewsLinks[targetIndex];
    const [{ error: e1 }, { error: e2 }] = await Promise.all([
      supabaseClient.from("user_news_links").update({ sort_order: target.sort_order }).eq("id", current.id),
      supabaseClient.from("user_news_links").update({ sort_order: current.sort_order }).eq("id", target.id),
    ]);
    if (e1 || e2) {
      alert("순서 변경 실패: " + (e1 || e2).message);
      return;
    }
    await loadNewsLinks();
  }

  async function loadNewsLinks() {
    const { data, error } = await supabaseClient.from("user_news_links").select("*").order("sort_order");
    allNewsLinks = error ? [] : data;
    renderNewsLinksList();
  }

  document.getElementById("newslinks-submit").addEventListener("click", async () => {
    const statusEl = document.getElementById("newslinks-status");
    const name = document.getElementById("newslinks-name").value.trim();
    const url = document.getElementById("newslinks-url").value.trim();
    if (!name || !url) {
      statusEl.textContent = "이름과 링크 주소를 모두 입력해 주세요.";
      return;
    }

    const row = {
      name,
      url,
      same_tab: document.getElementById("newslinks-sametab").checked,
      gradient: buildGradient(document.getElementById("newslinks-color1").value, document.getElementById("newslinks-color2").value),
    };

    statusEl.textContent = "저장 중...";
    let error;
    if (editingNewsLinkId) {
      ({ error } = await supabaseClient.from("user_news_links").update(row).eq("id", editingNewsLinkId));
    } else {
      const { data: { user } } = await supabaseClient.auth.getUser();
      const maxOrder = allNewsLinks.reduce((max, n) => Math.max(max, n.sort_order), 0);
      ({ error } = await supabaseClient.from("user_news_links").insert({ ...row, user_id: user.id, visible: true, sort_order: maxOrder + 1 }));
    }
    if (error) {
      statusEl.textContent = "저장 실패: " + error.message;
      return;
    }

    await loadNewsLinks();
    showNewsLinksList();
  });

  document.getElementById("newslinks-delete-btn").addEventListener("click", async () => {
    if (!editingNewsLinkId) return;
    if (!confirm("정말 삭제하시겠어요?")) return;
    const { error } = await supabaseClient.from("user_news_links").delete().eq("id", editingNewsLinkId);
    if (error) {
      alert("삭제 실패: " + error.message);
      return;
    }
    await loadNewsLinks();
    showNewsLinksList();
  });

  (async function initPage() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      location.href = "login.html";
      return;
    }
    await loadNewsLinks();
  })();
</script>
</body>
</html>
