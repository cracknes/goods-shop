<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6b9080">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>내 정보 수정 | 지후네 하우스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<nav id="bottom-nav" class="bottom-nav"></nav>
<div class="wrap">
  <div class="card">
    <p class="muted" id="email-display"></p>
    <input id="name" type="text" placeholder="이름">
    <input id="phone" type="tel" placeholder="전화번호 (예: 010-1234-5678)">
    <select id="gender">
      <option value="">성별 선택</option>
      <option value="male">남성</option>
      <option value="female">여성</option>
      <option value="prefer_not_to_say">선택 안 함</option>
    </select>
    <p class="form-section-label">비밀번호 변경</p>
    <div class="field-row">
      <label for="current-password">현재 비밀번호</label>
      <input id="current-password" type="password" autocomplete="current-password">
    </div>
    <div class="field-row">
      <label for="new-password">새 비밀번호</label>
      <input id="new-password" type="password" placeholder="6자 이상" autocomplete="new-password">
    </div>
    <div class="field-row">
      <label for="new-password-confirm">비밀번호 확인</label>
      <input id="new-password-confirm" type="password" autocomplete="new-password">
    </div>
    <button class="primary" id="save-btn" style="width:100%;">저장</button>
    <p id="message" class="error"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="bottom-nav.js"></script>
<script src="pwa.js"></script>
<script>
  const messageEl = document.getElementById("message");
  let currentUser = null;

  async function loadProfile() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      location.href = "login.html";
      return;
    }
    currentUser = user;

    document.getElementById("email-display").textContent = `이메일: ${user.email}`;
    document.getElementById("name").value = user.user_metadata?.name ?? "";
    document.getElementById("phone").value = user.user_metadata?.phone ?? "";
    document.getElementById("gender").value = user.user_metadata?.gender ?? "";
  }

  document.getElementById("save-btn").addEventListener("click", async () => {
    messageEl.textContent = "";
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const gender = document.getElementById("gender").value;
    const currentPassword = document.getElementById("current-password").value;
    const newPassword = document.getElementById("new-password").value;
    const newPasswordConfirm = document.getElementById("new-password-confirm").value;

    if (!name || !phone || !gender) {
      messageEl.textContent = "이름, 전화번호, 성별을 모두 입력해 주세요.";
      return;
    }

    const changingPassword = !!(currentPassword || newPassword || newPasswordConfirm);
    if (changingPassword) {
      if (!currentPassword) {
        messageEl.textContent = "비밀번호를 바꾸려면 현재 비밀번호를 입력해 주세요.";
        return;
      }
      if (newPassword.length < 6) {
        messageEl.textContent = "새 비밀번호는 6자 이상이어야 합니다.";
        return;
      }
      if (newPassword !== newPasswordConfirm) {
        messageEl.textContent = "새 비밀번호가 서로 일치하지 않습니다.";
        return;
      }

      // 로그인된 상태라고 바로 비밀번호를 바꿔주면, 자리를 비운 사이 남이 와서 마음대로
      // 비밀번호를 바꿔버릴 수 있음 — 현재 비밀번호로 다시 로그인을 시도해봐서 본인이 맞는지
      // 확인한 뒤에만 변경을 진행함.
      const { error: reauthError } = await supabaseClient.auth.signInWithPassword({
        email: currentUser.email,
        password: currentPassword,
      });
      if (reauthError) {
        messageEl.textContent = "현재 비밀번호가 올바르지 않습니다.";
        return;
      }
    }

    const payload = { data: { name, phone, gender } };
    if (changingPassword) payload.password = newPassword;

    const { error } = await supabaseClient.auth.updateUser(payload);

    if (error) {
      messageEl.textContent = "저장에 실패했습니다: " + error.message;
      return;
    }

    document.getElementById("current-password").value = "";
    document.getElementById("new-password").value = "";
    document.getElementById("new-password-confirm").value = "";
    alert("내 정보가 저장되었습니다.");
  });

  loadProfile();
</script>
</body>
</html>
